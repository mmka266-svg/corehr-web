<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04467f">
</head>
<body>
<title>Core HR</title>
<meta name="description" content="Core HR — الموارد البشرية وفق قانون العمل العُماني">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Noto+Sans+Devanagari:wght@400;500;700&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap">
<style>
/* Core HR — the old app's visual language, refined.
   Layout: one phone-width app column (max 480px) centred on any screen; curved cyan→navy header on top, light grey
   ground, white 24px cards, icon tiles in light blue, bottom navigation with a raised round chat button.
   Light-only by choice (the shipping app has no dark theme); every colour is a token and body sets its background.
   Fonts per language: Arabic Tajawal, Urdu Noto Nastaliq Urdu (taller line height), Hindi Noto Sans Devanagari. */
:root {
  --cyan: #1aa8ec;
  --ocean: #0a7fcb;
  --navy: #04467f;
  --deep: #032f5c;
  --ground: #f2f5f9;
  --outer: #e4eaf1;
  --card: #ffffff;
  --tile: #e6f1fb;
  --tile-ink: #0a6fb6;
  --line: #e1e8f0;
  --ink: #0f2742;
  --ink-2: #536579;
  --ink-3: #8696a8;
  --ok: #18914f;   --ok-bg: #e5f6ec;  --ok-line: #bfe6cf;
  --late: #a86a00; --late-bg: #fff3d9; --late-line: #f5d898;
  --bad: #d23b3f;  --bad-bg: #fdecec;  --bad-line: #f6c4c5;
  --info: #0a6fb6; --info-bg: #e6f1fb;
  --mute: #5f6f82; --mute-bg: #eef2f6;
  --on-brand: #ffffff;
  --grad: linear-gradient(to left, var(--navy) 0%, var(--ocean) 58%, var(--cyan) 100%);
  --grad-btn: linear-gradient(to left, var(--navy) 0%, var(--ocean) 70%, #129be0 100%);
  --shadow: 0 1px 2px rgba(4, 70, 127, .06), 0 8px 24px rgba(4, 70, 127, .07);
  --shadow-up: 0 -6px 24px rgba(4, 70, 127, .08);
  --font-ar: "Tajawal", "Noto Sans Arabic", "Segoe UI", Tahoma, Arial, sans-serif;
  --font-ur: "Noto Nastaliq Urdu", "Jameel Noori Nastaleeq", "Noto Naskh Arabic", "Segoe UI", Tahoma, sans-serif;
  --font-hi: "Noto Sans Devanagari", "Nirmala UI", "Mangal", "Tajawal", Arial, sans-serif;
  --font: var(--font-ar);
  --lh: 1.55;
  --r-card: 24px;
  --r-field: 16px;
  --r-tile: 12px;
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { background: var(--outer); color: var(--ink); }
html, body { margin: 0; }
[hidden] { display: none !important; }
#root[lang="ur"] { --font: var(--font-ur); --lh: 2.05; }
#root[lang="hi"] { --font: var(--font-hi); --lh: 1.6; }
#root { font-family: var(--font); line-height: var(--lh); }
#root [lang="ar"] { font-family: var(--font-ar); line-height: 1.6; }
#root[lang="ur"] h1, #root[lang="ur"] h2, #root[lang="ur"] h3 { line-height: 1.9; }
#root[lang="ur"] .hello h1 { font-size: 1.55rem; }
.lang-opt[lang="ur"] { font-family: var(--font-ur); }
.lang-opt[lang="hi"] { font-family: var(--font-hi); }
.lang-opt[lang="ar"] { font-family: var(--font-ar); }
body { font-family: var(--font); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--navy); }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; line-height: 1.3; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--cyan); outline-offset: 2px; border-radius: 8px; }
.num { font-variant-numeric: tabular-nums; }
.ltr { direction: ltr; unicode-bidi: isolate; }
.faint { color: var(--ink-3); font-size: .86rem; }
.muted { color: var(--ink-2); }
.boot { padding: 5rem 1rem; text-align: center; color: var(--ink-2); }
[dir="ltr"] .flip { transform: scaleX(-1); }

/* app column */
.app { max-width: 480px; margin: 0 auto; min-height: 100vh; background: var(--ground); position: relative; padding-bottom: calc(6.5rem + env(safe-area-inset-bottom, 0px)); }
@media (min-width: 520px) { .app { box-shadow: 0 0 0 1px var(--line), 0 20px 60px rgba(4, 70, 127, .10); } }

/* icons */
.ico { width: 1.25rem; height: 1.25rem; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tile { width: 2.6rem; height: 2.6rem; border-radius: var(--r-tile); background: var(--tile); color: var(--tile-ink); display: grid; place-items: center; flex: none; }
.tile.solid { background: var(--grad-btn); color: var(--on-brand); box-shadow: 0 6px 14px rgba(10, 127, 203, .28); }
.tile.big { width: 3.4rem; height: 3.4rem; border-radius: 16px; }
.tile.big .ico { width: 1.6rem; height: 1.6rem; }

/* ───── curved header ───── */
.topbar { background: var(--grad); color: var(--on-brand); border-radius: 0 0 28px 28px; position: relative;
  padding-block: calc(.55rem + env(safe-area-inset-top, 0px)) 1.15rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.strip { display: flex; align-items: center; justify-content: space-between; gap: .5rem; min-height: 2rem; }
.title-row { display: flex; align-items: center; gap: .75rem; margin-top: .65rem; min-height: 2.9rem; }
.title-row h1 { font-size: 1.22rem; font-weight: 700; display: flex; align-items: center; gap: .5rem; min-width: 0; }
.live-dot { width: .55rem; height: .55rem; border-radius: 50%; background: #2fd47a; box-shadow: 0 0 0 3px rgba(47, 212, 122, .25); flex: none; }
.hbtn { width: 2.9rem; height: 2.9rem; border-radius: 14px; border: 1px solid rgba(255, 255, 255, .28); background: rgba(255, 255, 255, .16);
  color: var(--on-brand); display: grid; place-items: center; cursor: pointer; flex: none; position: relative; text-decoration: none; }
.hbtn:hover { background: rgba(255, 255, 255, .24); }
.hbtn .badge { position: absolute; top: -.3rem; inset-inline-end: -.3rem; min-width: 1.15rem; height: 1.15rem; border-radius: 999px; background: #ffd166; color: var(--deep);
  font-size: .7rem; font-weight: 800; display: grid; place-items: center; padding: 0 .25rem; }
.spacer { flex: 1; }
.hello { margin-top: .6rem; display: flex; flex-direction: column; gap: .15rem; }
.hello .greet { display: inline-flex; align-items: center; gap: .4rem; color: rgba(255, 255, 255, .88); font-size: .95rem; }
.hello h1 { font-size: 1.85rem; font-weight: 800; letter-spacing: -.01em; }
.joined { align-self: flex-start; margin-top: .35rem; border: 1px solid rgba(255, 255, 255, .35); border-radius: 999px; padding: .2rem .8rem; font-size: .8rem;
  display: inline-flex; align-items: center; gap: .35rem; color: rgba(255, 255, 255, .92); }
.joined .ico { width: 1rem; height: 1rem; }

/* role switcher (demo control) — translucent pills inside the header */
.roles { margin-top: .9rem; display: flex; gap: 4px; background: rgba(3, 47, 92, .28); border-radius: 999px; padding: 4px; }
.roles button { flex: 1 1 auto; min-width: 0; border: 0; background: transparent; color: rgba(255, 255, 255, .86); border-radius: 999px; min-height: 2.3rem;
  font-size: .84rem; font-weight: 500; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 .4rem; }
.roles button[aria-pressed="true"] { background: var(--card); color: var(--navy); font-weight: 700; }
.roles-lbl { font-size: .72rem; color: rgba(255, 255, 255, .7); margin-top: .7rem; }
.roles-lbl + .roles { margin-top: .3rem; }

/* language chip */
.strip { justify-content: flex-end; }
.lang { display: inline-flex; gap: 2px; background: rgba(3, 47, 92, .28); border-radius: 999px; padding: 3px; max-width: 100%; }
.lang-opt { border: 0; background: transparent; color: rgba(255, 255, 255, .85); border-radius: 999px; padding: 0 .6rem; min-height: 2.2rem; font-size: .8rem; cursor: pointer; white-space: nowrap; line-height: 1.2;
  display: inline-flex; align-items: center; gap: .3rem; font-weight: 500; }
.lang-opt[aria-pressed="true"] { background: var(--card); color: var(--navy); font-weight: 700; }
.flag { font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; font-size: .95em; line-height: 1; }

/* wordmark */
.wordmark { display: inline-flex; align-items: center; direction: ltr; }
.wordmark svg { height: 1.6rem; width: auto; display: block; }

/* ───── page body ───── */
.page { display: flex; flex-direction: column; gap: 1.1rem; padding-block: 1.25rem 1rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.page.lift { margin-top: -.1rem; }
.sec-title { font-size: 1.12rem; font-weight: 700; display: flex; align-items: center; justify-content: space-between; gap: .75rem; }
.sec-title .faint { font-weight: 500; }
.card { background: var(--card); border-radius: var(--r-card); box-shadow: var(--shadow); padding: 1.15rem; display: flex; flex-direction: column; gap: .9rem; min-width: 0; }
.card-head { display: flex; align-items: center; gap: .8rem; }
.card-head .t { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: .1rem; }
.card-head h2 { font-size: 1.15rem; font-weight: 800; }
.lead { color: var(--ink-2); font-size: .92rem; }

/* profile card */
.profile-card .who { display: flex; align-items: center; gap: .9rem; }
.avatar { width: 3.6rem; height: 3.6rem; border-radius: 18px; background: var(--grad-btn); color: var(--on-brand); display: grid; place-items: center; font-weight: 800;
  font-size: 1.35rem; flex: none; box-shadow: 0 6px 16px rgba(10, 127, 203, .25); }
.avatar.sm { width: 2.6rem; height: 2.6rem; border-radius: 14px; font-size: 1rem; box-shadow: none; }
.who .t { flex: 1; min-width: 0; }
.who h2 { font-size: 1.2rem; font-weight: 800; }
.pills { display: flex; flex-wrap: wrap; gap: .35rem; margin-top: .4rem; }
.pill { background: var(--tile); color: var(--tile-ink); border-radius: 999px; padding: .1rem .65rem; font-size: .78rem; font-weight: 500; }
.actions3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .6rem; }
.act { border: 1px solid var(--line); background: var(--card); border-radius: 16px; min-height: 4.4rem; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: .3rem; font-size: .8rem; color: var(--ink-2); cursor: pointer; text-decoration: none; padding: .5rem .25rem; text-align: center; }
.act .ico { color: var(--ocean); }
.act.green { background: var(--ok-bg); border-color: var(--ok-line); color: var(--ok); }
.act.green .ico { color: var(--ok); }
.act.blue { background: var(--tile); border-color: #cfe3f5; color: var(--tile-ink); }

/* today status */
.schedule .chip { margin-inline-start: auto; }
.schedule { flex-wrap: wrap; background: var(--tile); border-radius: var(--r-field); padding: .8rem 1rem; display: flex; align-items: center; gap: .6rem; color: var(--tile-ink); font-weight: 600; }
.today-row { display: flex; align-items: center; justify-content: space-between; gap: .75rem; flex-wrap: wrap; }

/* quick actions */
.quick-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .6rem; }
.qa { background: var(--card); border-radius: 18px; box-shadow: var(--shadow); padding: .85rem .3rem .7rem; display: flex; flex-direction: column; align-items: center; gap: .45rem;
  text-decoration: none; text-align: center; font-size: .8rem; font-weight: 500; line-height: 1.3; min-height: 6.4rem; cursor: pointer; border: 0; color: var(--ink); position: relative; }
.qa .count { position: absolute; top: .45rem; inset-inline-end: .45rem; background: var(--bad); color: var(--on-brand); font-size: .7rem; font-weight: 800; min-width: 1.2rem; height: 1.2rem;
  border-radius: 999px; display: grid; place-items: center; padding: 0 .3rem; }

/* manager banner */
.mgr-banner { background: var(--grad); color: var(--on-brand); border-radius: var(--r-card); padding: 1.15rem; display: flex; align-items: center; gap: .9rem; text-decoration: none;
  box-shadow: 0 12px 28px rgba(10, 127, 203, .28); }
.mgr-banner .t { flex: 1; min-width: 0; }
.mgr-banner h2 { font-size: 1.15rem; font-weight: 800; }
.mgr-banner .cnt { display: inline-block; margin-top: .45rem; }
.mgr-banner p { color: rgba(255, 255, 255, .85); font-size: .88rem; }
.mgr-banner .tile { background: rgba(255, 255, 255, .18); color: var(--on-brand); }
.mgr-banner .cnt { background: rgba(255, 255, 255, .2); border-radius: 999px; padding: .2rem .7rem; font-size: .8rem; font-weight: 700; white-space: nowrap; }

/* team strip */
.team { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .6rem; }
.member { background: var(--card); border-radius: 18px; box-shadow: var(--shadow); padding: .9rem .4rem; display: flex; flex-direction: column; align-items: center; gap: .3rem; text-align: center; min-width: 0; }
.member .avatar { position: relative; }
.member .avatar i { position: absolute; bottom: -2px; inset-inline-end: -2px; width: .8rem; height: .8rem; border-radius: 50%; border: 2px solid var(--card); background: var(--ink-3); }
.member .avatar i.in { background: #2fd47a; }
.member .avatar i.late { background: #f0a925; }
.member b { font-size: .86rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.member span { font-size: .72rem; color: var(--ink-3); }

/* status chips */
.chip { display: inline-flex; align-items: center; gap: .35rem; border-radius: 999px; padding: .2rem .7rem; font-size: .78rem; font-weight: 700; white-space: nowrap; border: 1px solid transparent; }
.chip .ico { width: .95rem; height: .95rem; stroke-width: 2.2; }
.chip.ok, .chip.approved, .chip.present { background: var(--ok-bg); color: var(--ok); border-color: var(--ok-line); }
.chip.late, .chip.pending_proof, .chip.draft { background: var(--late-bg); color: var(--late); border-color: var(--late-line); }
.chip.bad, .chip.rejected, .chip.absent_unexcused { background: var(--bad-bg); color: var(--bad); border-color: var(--bad-line); }
.chip.pending, .chip.on_leave, .chip.info { background: var(--info-bg); color: var(--info); border-color: #cfe3f5; }
.chip.mute, .chip.cancelled, .chip.rest_day, .chip.public_holiday, .chip.absent_excused, .chip.outside_shift { background: var(--mute-bg); color: var(--mute); border-color: var(--line); }

/* list of request cards */
.list { display: flex; flex-direction: column; gap: .7rem; }
.row { background: var(--card); border-radius: 20px; box-shadow: var(--shadow); padding: .9rem 1rem; display: flex; align-items: center; gap: .8rem; flex-wrap: wrap; }
.row-main { flex: 1 1 10rem; min-width: 0; display: flex; flex-direction: column; gap: .15rem; }
.row-title { font-weight: 700; }
.row-sub { font-size: .84rem; color: var(--ink-3); }
.row-end { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; margin-inline-start: auto; }
.empty { background: var(--card); border-radius: var(--r-card); box-shadow: var(--shadow); padding: 2rem 1.2rem; display: flex; flex-direction: column; align-items: center; gap: .6rem; text-align: center; }
.empty .tile { width: 4.5rem; height: 4.5rem; border-radius: 50%; }
.empty .tile .ico { width: 2rem; height: 2rem; }
.empty h3 { font-size: 1.1rem; font-weight: 700; }
.empty p { color: var(--ink-3); font-size: .9rem; max-width: 22rem; }
.empty.ok .tile { background: var(--ok-bg); color: var(--ok); }

/* forms: field tiles like the old app */
form { display: flex; flex-direction: column; gap: .7rem; }
.field { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-field); padding: .65rem .85rem; display: flex; gap: .75rem; align-items: center; min-width: 0; }
.field:focus-within { border-color: var(--ocean); box-shadow: 0 0 0 3px rgba(26, 168, 236, .18); }
.field .tile { width: 2.4rem; height: 2.4rem; }
.field .body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: .05rem; }
.field label, .field .lbl { font-size: .78rem; color: var(--ink-3); font-weight: 500; }
.field input, .field select, .field textarea { border: 0; background: transparent; padding: .1rem 0; min-height: 1.9rem; width: 100%; font-weight: 600; font-size: .98rem; outline: none; color: var(--ink); }
.field textarea { min-height: 4.5rem; resize: vertical; font-weight: 500; }
.field .help { font-size: .76rem; color: var(--ink-3); }
.field .spelled { font-size: .8rem; color: var(--ocean); font-weight: 600; }
.field.plain { padding: .8rem .95rem; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .7rem; }
@media (max-width: 460px) { .two.dates { grid-template-columns: minmax(0, 1fr); } }
.three { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .7rem; }
@media (max-width: 420px) { .three { grid-template-columns: minmax(0, 1fr); } }
.check { display: flex; gap: .6rem; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: var(--r-field); padding: .8rem .95rem; font-weight: 500; min-height: 3.2rem; }
.check input { width: 1.2rem; height: 1.2rem; accent-color: var(--ocean); }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .5rem; border-radius: 999px; min-height: 2.75rem; padding: 0 1.15rem; font-weight: 700; cursor: pointer;
  border: 1px solid var(--line); background: var(--card); color: var(--navy); text-decoration: none; font-size: .92rem; }
.btn.primary { background: var(--grad-btn); color: var(--on-brand); border: 0; box-shadow: 0 8px 18px rgba(10, 127, 203, .3); }
.btn.block { width: 100%; min-height: 3.3rem; font-size: 1.02rem; }
.btn.soft { background: var(--tile); color: var(--tile-ink); border-color: transparent; }
.btn.danger { background: var(--bad-bg); color: var(--bad); border-color: var(--bad-line); }
.btn.small { min-height: 2.3rem; padding: 0 .9rem; font-size: .84rem; }
.btn[disabled] { opacity: .45; cursor: not-allowed; box-shadow: none; }
.link { background: none; border: 0; color: var(--ocean); cursor: pointer; padding: .3rem 0; font-weight: 700; text-decoration: none; font-size: .9rem; }
.chips-row { display: flex; gap: .45rem; flex-wrap: wrap; align-items: center; }
.try { border: 1px dashed #9cc8ea; background: var(--card); color: var(--tile-ink); border-radius: 999px; padding: 0 .85rem; min-height: 2.3rem; font-size: .82rem; font-weight: 600; cursor: pointer; }
.try:hover { background: var(--tile); }

/* segmented controls */
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--card); border-radius: 999px; padding: 4px; box-shadow: var(--shadow); gap: 4px; }
.seg button { border: 0; background: transparent; border-radius: 999px; min-height: 2.8rem; cursor: pointer; font-weight: 600; color: var(--ink-2); display: inline-flex; align-items: center; justify-content: center; gap: .4rem; }
.seg button[aria-pressed="true"] { background: var(--grad-btn); color: var(--on-brand); }
.tabs-top { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--card); border-radius: 999px; padding: 4px; box-shadow: var(--shadow); }
.tabs-top a { text-align: center; padding: .55rem .5rem; border-radius: 999px; text-decoration: none; color: var(--ink-2); font-weight: 600; font-size: .9rem; }
.tabs-top a[aria-current="page"] { background: var(--grad-btn); color: var(--on-brand); }

/* attendance */
.punch { display: flex; flex-direction: column; align-items: center; gap: .8rem; padding-block: .5rem; }
.punch-btn { width: 9.5rem; height: 9.5rem; border-radius: 50%; border: 0; background: var(--grad-btn); color: var(--on-brand); display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: .35rem; font-weight: 800; font-size: 1.05rem; cursor: pointer; box-shadow: 0 0 0 10px var(--tile), 0 16px 34px rgba(10, 127, 203, .35); }
.punch-btn .ico { width: 2.4rem; height: 2.4rem; stroke-width: 1.6; }
.punch-btn.out { background: linear-gradient(to left, #0b5d4f, #18914f 70%, #2bb36a 100%); box-shadow: 0 0 0 10px var(--ok-bg), 0 16px 34px rgba(24, 145, 79, .3); }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: .45rem 1rem; font-size: .92rem; margin: 0; }
.kv dt { color: var(--ink-3); }
.kv dd { margin: 0; font-weight: 600; min-width: 0; overflow-wrap: anywhere; }

/* decisions */
.decision { display: flex; flex-direction: column; gap: .6rem; }
.reasons { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .5rem; }
.reason { border-radius: 16px; padding: .75rem .9rem; display: flex; flex-direction: column; gap: .3rem; border: 1px solid transparent; }
.reason.block { background: var(--bad-bg); border-color: var(--bad-line); }
.reason.warn { background: var(--late-bg); border-color: var(--late-line); }
.reason.note { background: var(--mute-bg); border-color: var(--line); }
.reason-meta { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; font-size: .78rem; color: var(--ink-2); }
.rid { font-weight: 800; font-size: .74rem; border-radius: 6px; padding: .05rem .45rem; direction: ltr; unicode-bidi: isolate; letter-spacing: .02em; }
.reason.block .rid { background: var(--bad); color: var(--on-brand); }

"title_ar\": \"ساعات العمل في رمضان\",\n   \"rule_ar\": \"الحد الأقصى في رمضان 6 ساعات يوميًا أو 30 ساعة أسبوعيًا للعمال المسلمين.\",\n   \"logic\": \"if is_ramadan and employee.religion == 'muslim': max_daily=6, max_weekly=30\",\n   \"params\": {\n    \"ramadan_max_daily\": 6,\n    \"ramadan_max_weekly\": 30\n   },\n   \"type\": \"legal_max\",\n   \"applies_to\": \"muslim\",\n   \"source\": \"LL\",\n   \"article\": \"70\",\n   \"certainty\": \"explicit\",\n   \"alert\": \"تفعيل جدول رمضان تلقائيًا بتاريخ بداية الشهر\",\n   \"data_note\": \"يتطلب حقل الديانة — بيانات حساسة؛ يُفضّل خيار (يطبّق دوام رمضان: نعم/لا) بدل تخزين الديانة\",\n   \"audit\": \"approved\"\n  },\n  {\n   \"id\": \"ATT-004\",\n   \"module\": \"attendance\",\n   \"title_ar\": \"تعريف الساعات الليلية\",\n   \"rule_ar\": \"ساعات العمل الليلية هي الفترة بين 9 مساءً و5 صباحًا.\",\n   \"logic\": \"night_window = 21:00–05:00\",\n   \"params\": {\n    \"night_start\": \"21:00\",\n    \"night_end\": \"05:00\"\n   },\n   \"type\": \"fixed\",\n   \"applies_to\": \"all\",\n   \"source\": \"LL\",\n   \"article\": \"1(16)\",\n   \"certainty\": \"explicit\",\n   \"audit\": \"approved\"\n  },\n  {\n   \"id\": \"ATT-005\",\n   \"module\": \"attendance\",\n   \"title_ar\": \"نشر جدول الدوام\",\n   \"rule_ar\": \"يجب وضع جدول لساعات العمل ومواعيد الراحة اليومية والأسبوعية في مكان ظاهر بالمنشأة.\",\n   \"logic\": \"feature: publish shift schedule visible to all employees\",\n   \"params\": {},\n   \"type\": \"procedure\",\n   \"applies_to\": \"employer\",\n   \"source\": \"LL\",\n   \"article\": \"70\",\n   \"certainty\": \"explicit\",\n   \"audit\": \"approved\"\n  },\n  {\n   \"id\": \"ATT-006\",\n   \"module\": \"attendance\",\n   \"title_ar\": \"ساعة الرضاعة\",\n   \"rule_ar\": \"تُمنح العاملة المرضعة ساعة يوميًا لرعاية طفلها لمدة سنة بعد انتهاء إجازة الوضع، تحددها العاملة، وتُحسب من ساعات العمل الفعلية.\",\n   \"logic\": \"if nursing_period_active (<=365 days after maternity_end): allow 1 paid hour/day, counted as worked\",\n   \"params\": {\n    \"hours_per_day\": 1,\n    \"duration_days\": 365\n   },\n   \"type\": \"legal_min\",\n   \"applies_to\": \"female\",\n   \"source\": \"LL\",\n   \"article\": \"76\",\n   \"certainty\": \"explicit\",\n   \"audit\": \"approved\"\n  },\n  {\n   \"id\": \"ATT-007\",\n   \"module\": \"attendance\",\n   \"title_ar\": \"النقل من الدوام الليلي لسبب صحي\",\n   \"rule_ar\": \"يتعين نقل العامل من الدوام الليلي إلى النهاري إذا ثبت بشهادة طبية معتمدة عدم قدرته على العمل ليلًا.\",\n   \"logic\": \"workflow: medical certificate → force shift change to day\",\n   \"params\": {},\n   \"type\": \"procedure\",\n   \"applies_to\": \"night_workers\",\n   \"source\": \"LL\",\n   \"article\": \"74\",\n   \"certainty\": \"explicit\",\n   \"audit\": \"approved\"\n  },\n  {\n   \"id\": \"ATT-008\",\n   \"module\": \"attendance\",\n   \"title_ar\": \"الغياب بدون عذر — الفصل\",\n   \"rule_ar\": \"يجوز الفصل دون إخطار ودون مكافأة إذا تغيب العامل بدون عذر مقبول أكثر من 7 أيام متصلة، أو أكثر من 10 أيام منفصلة خلال العام، بشرط إنذار كتابي بعد غياب 5 أيام في الحالة الثانية.\",\n   \"logic\": \"track unexcused_absence: consecutive>7 → eligible; separate_in_year>10 → eligible only if written_warning issued at 5\",\n   \"params\": {\n    \"consecutive_days\": 7,\n    \"separate_days_year\": 10,\n    \"warning_at_days\": 5\n   },\n   \"type\": \"fixed\",\n   \"applies_to\": \"all\",\n   \"source\": \"LL\",\n   \"article\": \"40(4)\",\n   \"certainty\": \"interpretation\",\n   \"alert\": \"عند الوصول 5 أيام غياب منفصلة: إصدار إنذار كتابي إلزامي\",\n   \"audit\": \"approved\",\n   \"note\": \"منطقة رمادية: النص يضع «أكثر من» قبل الأيام السبعة المتصلة، وغير واضح إن كانت تشمل الأيام العشرة المنفصلة؛ المحرك يطبق القراءة الأصلح للعامل (أكثر من 10).\"\n  },\n  {\n   \"id\": \"ATT-009\",\n   \"module\": \"attendance\",\n   \"title_ar\": \"الخصم عن الغياب\",\n   \"rule_ar\": \"العامل الذي يغيب بدون إذن أو عذر يستحق أجر الساعات التي عمل فيها فعلًا فقط.\",\n   \"logic\": \"unpaid_absence_deduction = hourly_rate * absent_hours\",\n   \"params\": {},\n   \"type\": \"fixed\",\n   \"applies_to\": \"all\",\n   \"source\": \"LL\",\n   \"article\": \"97\",\n   \"certainty\": \"explicit\",\n   \"audit\": \"approved\"\n  },\n  {\n   \"id\": \"ATT-010\",\n   \"module\": \"attendance\",\n   \"title_ar\": \"حساب أجر الساعة\",\n   \"rule_ar\": \"أجر الساعة للعامل الشهري = الأجر الشامل ÷ المدة التي يُمنح عنها الأجر ÷ عدد الساعات الأصلية حسب العقد أو القانون أيهما أقل.\",\n   \"logic\": \"hourly_rate = wage / 30 / min(contract_daily_hours_excluding_rest_hour, 8); contract hours from contracts.daily_hours, else the employee's standard shift template, never a one-off shift; during Ramadan, for workers on the Ramadan schedule only, the legal limit is 6 (ramadan_divisor = legal_6)\",\n   \"params\": {\n    \"month_days\": 30,\n    \"ramadan_divisor\": \"legal_6\",\n    \"ramadan_divisor_options\": [\n     \"contract\",\n     \"legal_6\"\n    ]\n   },\n   \"type\": \"fixed\",\n   \"applies_to\": \"monthly_paid\",\n   \"source\": \"LL\",\n   \"article\": \"97, 1(24)\",\n   \"certainty\": \"interpretation\",\n   \"note\": \"المادة 1(24) تعرّف الشهر بـ30 يومًا؛ تطبيق القسمة على 30 تفسير راجح للنص\",\n   \"audit\": \"approved\",\n   \"needs_lawyer\": [\n    \"ramadan_divisor\"\n   ],\n   \"gray_area_ar\": \"قاسم أجر الساعة في رمضان (6 ساعات) لمن يطبَّق عليهم دوام رمضان فقط — خيار مؤقت أصلح للعامل يحتاج محاميًا؛ لا يُخزَّن حقل الديانة بل علم جدول رمضان\",\n   \"amended_by\": \"docs/legal/backend-assumptions-audit.md (2026-11-01)\"\n  },\n  {\n   \"id\": \"ATT-011\",\n   \"module\": \"attendance\",\n   \"title_ar\": \"لا خصم عن الاستدعاء الرسمي\",\n   \"rule_ar\": \"لا يجوز الخصم عن الغياب بسبب استدعاء كتابي للحضور أمام المحكمة أو الادعاء العام أو اللجنة أو الجهة المختصة.\",\n   \"logic\": \"absence_type 'official_summons' with document → paid\",\n   \"params\": {},\n   \"type\": \"fixed\",\n   \"applies_to\": \"all\",\n   \"source\": \"LL\",\n   \"article\": \"97\",\n   \"certainty\": \"explicit\",\n   \"audit\": \"approved\"\n  },\n  {\n   \"id\": \"OT-001\",\n   \"module\": \"overtime\",\n   \"title_ar\": \"شروط العمل الإضافي\",\n   \"rule_ar\": \"الإضافي يتطلب موافقة العامل، ولا يزيد مجموع الساعات الأصلية والإضافية على 12 ساعة يوميًا.\",\n   \"logic\": \"require employee_consent; block if total_hours_day > 12\",\n   \"params\": {\n    \"max_total_daily_hours\": 12\n   },\n   \"type\": \"legal_max\",\n   \"applies_to\": \"all\",\n   \"source\": \"LL\",\n   \"article\": \"71\",\n   \"certainty\": \"explicit\",\n   \"audit\": \"approved\"\n  },\n  {\n   \"id\": \"OT-002\",\n   \"module\": \"overtime\",\n   \"title_ar\": \"أجر الإضافي العادي\",\n   \"rule_ar\": \"الأجر الإضافي = الأجر الأساسي للساعات الإضافية + 25% على الأقل نهارًا و50% على الأقل ليلًا، أو إذن تغيب بدلًا منها.\",\n   \"logic\": \"extra = basic_hourly × (day_min/60 × 1.25 + night_min/60 × 1.50); night minutes = those inside ATT-004 window; company option night_whole_block (pay whole block at night rate, better for worker) OR time_off\",\n   \"params\": {\n    \"day_premium\": 0.25,\n    \"night_premium\": 0.5,\n    \"base\": \"basic_wage\",\n    \"night_whole_block_default\": false\n   },\n   \"type\": \"legal_min\",\n   \"applies_to\": \"all\",\n   \"source\": \"LL\",\n   \"article\": \"71\",\n   \"certainty\": \"explicit\",\n   \"note\": \"الحساب على الأجر الأساسي وليس الشامل\",\n   \"audit\": \"approved\",\n   \"interpretation_ar\": \"تُحسب علاوة الليل على الدقائق الواقعة بين 21:00 و05:00 فقط، والباقي بعلاوة النهار (م71 + م1(16)); احتساب الكتلة كاملة بسعر الليل خيار أفضل للعامل (م4)\",\n   \"certainty_split\": \"likely\",\n   \"amended_by\": \"docs/legal/backend-assumptions-audit.md (2026-11-01)\"\n  },\n  {\n   \"id\": \"OT-003\",\n   \"module\": \"overtime\",\n   \"title_ar\": \"العمل في الراحة الأسبوعية أو العطلة الرسمية\",\n   \"rule_ar\": \"مبلغ يعادل 100% من الأجر الأساسي اليومي بالإضافة إلى أجر اليوم ذاته، أو يوم تعويضي عن كل يوم.\",\n   \"logic\": \"rest_day_work_pay = basic_daily * 1.0 (in addition to normal day pay) OR 1 comp day\",\n   \"params\": {\n    \"premium\": 1.0,\n    \"comp_days\": 1\n   },\n   \"type\": \"legal_min\",\n   \"applies_to\": \"all\",\n   \"source\": \"LL\",\n   \"article\": \"71\",\n   \"certainty\": \"explicit\",\n   \"audit\": \"approved\"\n  },\n  {\n   \"id\": \"OT-004\",\n   \"module\": \"overtime\",\n   \"title_ar\": \"الإضافي بدون موافقة العامل (حالات استثنائية)\",\n   \"rule_ar\": \"جرد سنوي/ميزانية/تصفية (بحد 15 يومًا في العام) أو منع حادث/خسارة/ضغط غير عادي (مع إبلاغ الجهة المختصة خلال 24 ساعة): +50% نهارًا، +75% ليلًا، و200% للراحة/العطلة أو يوما راحة عن كل يوم عطلة رسمية.\",\n   \"logic\": \"if ot_reason in [inventory, emergency]: no consent; premiums split by minutes 0.50 day / 0.75 night; rest/holiday 2.0 or 2 comp days (holiday); inventory > 15 days/year blocked unless authority_licence_ref (art 72(1) «ما لم ترخص الجهة المختصة بمدد أطول»); 12h daily cap kept (interim)\",\n   \"params\": {\n    \"inventory_max_days_year\": 15,\n    \"day_premium\": 0.5,\n    \"night_premium\": 0.75,\n    \"rest_holiday_premium\": 2.0,\n    \"holiday_comp_days\": 2,\n    \"notify_hours\": 24,\n    \"licence_lifts_inventory_cap\": true,\n    \"apply_12h_cap\": true\n   },\n   \"type\": \"legal_min\",\n   \"applies_to\": \"all\",\n   \"source\": \"LL\",\n   \"article\": \"72\",\n   \"certainty\": \"explicit\",\n   \"alert\": \"حالة طارئة: تذكير بإبلاغ الوزارة خلال 24 ساعة\",\n   \"audit\": \"approved\",\n   \"gray_area_ar\": \"هل يرفع الاستثناء في م72 سقف 12 ساعة في م71؟ الخيار المؤقت: يبقى السقف (أصلح للعامل) — يحتاج محاميًا\",\n   \"needs_lawyer\": [\n    \"apply_12h_cap\"\n   ],\n   \"amended_by\": \"docs/legal/backend-assumptions-audit.md (2026-11-01)\"\n  },\n  {\n   \"id\": \"LV-001\",\n   \"module\": \"leave\",\n   \"title_ar\": \"الراحة الأسبوعية\",\n   \"rule_ar\": \"راحة أسبوعية مدفوعة الأجر لا تقل عن يومين متتاليين، ولا يُحرم منها العامل بسبب غيابه.\",\n   \"logic\": \"explicit weekly rest pattern per employee (ISO weekdays 1–7, >= 2 consecutive, wrap Sun→Mon); a day with no shift and not a rest day → ATT-005 HR review (never silently priced as rest day)\",\n   \"params\": {\n    \"min_days\": 2\n   },\n   \"type\": \"legal_min\",\n   \"applies_to\": \"all\",\n   \"source\": \"LL\",\n   \"article\": \"77\",\n   \"certainty\": \"explicit\",\n   \"audit\": \"approved\",\n   \"amended_by\": \"docs/legal/backend-assumptions-audit.md (2026-11-01)\"\n  },\n  {\n   \"id\": \"LV-002\",\n   \"module\": \"leave\",\n   \"title_ar\": \"الإجازة السنوية\",\n   \"rule_ar\": \"إجازة سنوية بأجر شامل لا تقل عن 30 يومًا، ولا تُستحق قبل مضي 6 أشهر من الالتحاق.\",\n   \"logic\": \"annual_entitlement >= 30; block request if service_days < 6 months\",\n   \"params\": {\n    \"min_days\": 30,\n    \"eligibility_months\": 6,\n    \"pay_base\": \"gross\"\n   },\n   \"type\": \"legal_min\",\n   \"applies_to\": \"all\",\n   \"source\": \"LL\",\n   \"article\": \"78\",\n   \"certainty\": \"explicit\",\n   \"note\": \"القانون لا يحدد آلية تراكم شهري أو نسبة لجزء من السنة — اجعلها إعدادًا للشركة ولا تعرضها كحكم قانوني.\",\n   \"audit\": \"approved\"\n  },\n  {\n   \"id\": \"LV-003\",\n   \"module\": \"leave\",\n   \"title_ar\": \"ترحيل رصيد الإجازة السنوية\",\n   \"rule_ar\": \"يحتفظ العامل برصيد لا يزيد على 30 يومًا، ما لم يكن عدم الانتفاع راجعًا لمصلحة العمل.\",\n   \"logic\": \"carry_over_cap = 30 unless reason == 'business_need'\",\n   \"params\": {\n    \"carry_over_cap\": 30\n   },\n   \"type\": \"legal_min\",\n   \"applies_to\": \"all\",\n   \"source\": \"LL\",\n   \"article\": \"78\",\n   \"certainty\": \"explicit\",\n   \"audit\": \"approved\"\n  },\n  {\n   \"id\": \"LV-004\",\n   \"module\": \"leave\",\n   \"title_ar\": \"تذكرة سفر للوافد\",\n   \"rule_ar\": \"يستحق العامل غير العماني تذكرة ذهاب وإياب إلى بلده لقضاء إجازته المتفق عليها في العقد.\",\n   \"logic\": \"if nationality != OM: ticket entitlement per contract\",\n   \"params\": {},\n   \"type\": \"fixed\",\n   \"applies_to\": \"expat\",\n   \"source\": \"LL\",\n   \"article\": \"78\",\n   \"certainty\": \"explicit\",\n   \"audit\": \"approved\"\n  },\n  {\n   \"id\": \"LV-005\",\n   \"module\": \"leave\",\n   \"title_ar\": \"عدم جواز التنازل عن الإجازة\",\n   \"rule_ar\": \"لا يجوز للعامل التنازل عن إجازته السنوية.\",\n   \"logic\": \"block 'waive leave' action\",\n   \"params\": {},\n   \"type\": \"fixed\",\n   \"applies_to\": \"all\",\n   \"source\": \"LL\",\n   \"article\": \"78\",\n   \"certainty\": \"explicit\",\n   \"audit\": \"approved\"\n  },\n  {\n   \"id\": \"LV-006\",\n   \"module\": \"leave\",\n   \"title_ar\": \"تجزئة وتأجيل الإجازة السنوية\",\n   \"rule_ar\": \"يجوز تجزئة الإجازة (عدا الأحداث)، ولصاحب العمل تأجيلها لمصلحة العمل بما لا يجاوز 6 أشهر.\",\n   \"logic\": \"allow split (except minors); postpone_max = 6 months\",\n   \"params\": {\n    \"max_postpone_months\": 6\n   },\n   \"type\": \"legal_max\",\n   \"applies_to\": \"all\",\n   \"source\": \"LL\",\n   \"article\": \"81\",\n   \"certainty\": \"explicit\",\n   \"audit\": \"approved\"\n  },\n  {\n   \"id\": \"LV-007\",\n   \"module\": \"leave\",\n   \"title_ar\": \"إلزامية القيام بالإجازة\",\n   \"rule_ar\": \"يتعين قيام العامل بإجازة مرة على الأقل كل سنتين وبمدة لا تقل عن 30 يومًا.\",\n   \"logic\": \"alert if no leave >= 30 days in last 24 months\",\n   \"params\": {\n    \"period_months\": 24,\n    \"min_days\": 30\n   },\n   \"type\": \"legal_min\",\n   \"applies_to\": \"all\",\n   \"source\": \"LL\",\n   \"article\": \"81\",\n   \"certainty\": \"explicit\",\n   \"alert\": \"موظف لم يأخذ 30 يومًا خلال سنتين\",\n   \"audit\": \"approved\"\n  },\n  {\n   \"id\": \"LV-008\",\n   \"module\": \"leave\",\n   \"title_ar\": \"تعويض رصيد الإجازة نقدًا\",\n   \"rule_ar\": \"أثناء الخدمة: يجوز دفع الأجر الأساسي عن الأيام غير المستخدمة بموافقة العامل الكتابية. عند انتهاء الخدمة: يستحق الأجر الشامل عن الرصيد.\",\n   \"logic\": \"encash_during_service = basic_daily * days (requires written consent); at_termination = gross_daily * balance\",\n   \"params\": {\n    \"during_service_base\": \"basic\",\n    \"termination_base\": \"gross\"\n   },\n   \"type\": \"fixed\",\n   \"applies_to\": \"all\",\n   \"source\": \"LL\",\n   \"article\": \"81\",\n   \"certainty\": \"explicit\",\n   \"audit\": \"approved\"\n  },\n  {\n   \"id\": \"LV-009\",\n   \"module\": \"leave\",\n   \"title_ar\": \"العطل الرسمية\",\n   \"rule_ar\": \"يستحق العامل أجره الشامل خلال الإجازات الرسمية المقررة قانونًا.\",\n   \"logic\": \"public_holiday = paid at gross; calendar configured yearly\",\n   \"params\": {},\n   \"type\": \"fixed\",\n   \"applies_to\": \"all\",\n   \"source\": \"LL\",\n   \"article\": \"79\",\n   \"certainty\": \"explicit\",\n   \"note\": \"العطل الرسمية: م.س 88/2022 المعدل بـ م.س 15/2025 (العيد الوطني صار 20–21 نوفمبر). تُدار كتقويم سنوي قابل للتحديث.\",\n   \"audit\": \"approved\"\n  },\n  {\n   \"id\": \"LV-010\",\n   \"module\": \"leave\",\n   \"title_ar\": \"إجازة بدون أجر\",\n   \"rule_ar\": \"يجوز منحها بطلب العامل، ويتحمل العامل كامل اشتراكات صندوق الحماية الاجتماعية (حصته وحصة صاحب العمل والحكومة)، وتُحسب ضمن مدة الخدمة ولا تُحسب في مكافأة نهاية الخدمة.\",\n   \"logic\": \"unpaid_leave: employee pays all SPF shares; counts in service; excluded from EOSB days\",\n   \"params\": {},\n   \"type\": \"fixed\",\n   \"applies_to\": \"all\",\n   \"source\": \"LL\",\n   \"article\": \"80\",\n   \"certainty\": \"explicit\",\n   \"audit\": \"approved\"\n  },\n  {\n   \"id\": \"LV-011\",\n   \"module\": \"leave\",\n   \"title_ar\": \"الإجازة المرضية\",\n   \"rule_ar\": \"حتى 182 يومًا في العام بنسب من الأجر الشامل: الأيام 1–21: 100%، 22–35: 75%، 36–70: 50%، 71–182: 35%.\",\n   \"logic\": \"sick_pay_pct by cumulative sick day in year: [1-21]=1.00, [22-35]=0.75, [36-70]=0.50, [71-182]=0.35; >182 → not covered\",\n   \"params\": {\n    \"max_days_year\": 182,\n    \"tiers\": [\n     {\n      \"from\": 1,\n      \"to\": 21,\n      \"pct\": 1.0\n     },\n     {\n      \"from\": 22,\n      \"to\": 35,\n      \"pct\": 0.75\n     },\n     {\n      \"from\": 36,\n      \"to\": 70,\n      \"pct\": 0.5\n     },\n     {\n      \"from\": 71,\n      \"to\": 182,\n      \"pct\": 0.35\n     }\n    ],\n    \"pay_base\": \"gross\",\n    \"employer_borne_days\": 7,\n    \"spf_reimbursed_days\": [\n     8,\n     182\n    ]\n   },\n   \"type\": \"legal_min\",\n   \"applies_to\": \"all\",\n   \"source\": \"LL\",\n   \"article\": \"82\",\n   \"certainty\": \"explicit\",\n   \"note\": \"منذ 19 يوليو 2026 (فرع تأمين الإجازات المرضية — م.س 60/2025 وقرار الصندوق ر/13/2026): صاحب العمل يدفع للعامل بنفس الشرائح، يتحمل الأيام 1–7، ويسترد الأيام 8–182 من صندوق الحماية الاجتماعية؛ اشتراك صاحب العمل 1% من الأجر الشامل. أرقام الاسترداد من مصادر إخبارية — تُؤكد من نص اللائحة.\",\n   \"requires_verification\": true,\n   \"audit_fix\": \"Keep employee entitlement as is. Add employer_cost vs spf_reimbursable split: days 1-7 employer, days 8-21 100%, 22-35 75%, 36-70 50%, 71-182 35% reimbursable; per calendar year; claim via SPF portal; spf_leave_contribution = 1% of total wage for Omani and expat.\",\n   \"audit\": \"fixed\"\n  },\n  {\n   \"id\": \"LV-012\",\n   \"module\": \"leave\",\n   \"title_ar\": \"إجازة رعاية طفل بدون أجر\",\n   \"rule_ar\": \"يجوز منح العاملة بناء على طلبها إجازة بدون أجر لرعاية طفلها حتى سنة، وتتحمل كافة الاشتراكات (نسبتها ونسبة صاحب العمل والحكومة)، وتُحسب ضمن مدة الخدمة ولا يُعتد بها في حساب مكافأة نهاية الخدمة (م83، م61).\",\n   \"logic\": \"childcare_unpaid_max = 365 days; employee pays SPF; excluded from EOSB\",\n   \"params\": {\n    \"max_days\": 365\n   },\n   \"type\": \"legal_max\",\n   \"applies_to\": \"female\",\n   \"source\": \"LL\",\n   \"article\": \"83\",\n   \"certainty\": \"explicit\",\n   \"audit\": \"approved\"\n  },\n  {\n   \"id\": \"LV-013\",\n   \"module\": \"leave\",\n   \"title_ar\": \"إجازة الأبوة\",\n   \"rule_ar\": \"7 أيام بأجر شامل، بشرط أن يولد الطفل حيًا، ولا تتجاوز اليوم 98 من عمر الطفل.\",\n   \"logic\": \ explicit\",\n   \"document_required\": true,\n   \"audit\": \"approved\"\n  },\n  {\n   \"id\": \"LV-021\",\n   \"module\": \"leave\",\n   \"title_ar\": \"إجازة مرافقة مريض\",\n   \"rule_ar\": \"15 يومًا طوال العام للعامل العماني لمرافقة مريض تربطه به علاقة زوجية أو قرابة حتى الدرجة الثانية.\",\n   \"logic\": \"if nationality == OM and relation_degree <= 2 or spouse: companion_cap_year = 15\",\n   \"params\": {\n    \"max_days_year\": 15,\n    \"max_relation_degree\": 2\n   },\n   \"type\": \"legal_min\",\n   \"applies_to\": \"omani\",\n   \"source\": \"LL\",\n   \"article\": \"84(9)\",\n   \"certainty\": \"explicit\",\n   \"document_required\": true,\n   \"audit\": \"approved\"\n  },\n  {\n   \"id\": \"LV-022\",\n   \"module\": \"leave\",\n   \"title_ar\": \"إجازة الوضع\",\n   \"rule_ar\": \"98 يومًا لتغطية فترة ما قبل وبعد الولادة؛ ما قبل الولادة بتوصية طبية ولا يتجاوز 14 يومًا، والباقي من تاريخ الولادة.\",\n   \"logic\": \"maternity_total = 98; pre_birth <= 14 (medical recommendation); remainder from birth date\",\n   \"params\": {\n    \"total_days\": 98,\n    \"max_pre_birth_days\": 14\n   },\n   \"type\": \"legal_min\",\n   \"applies_to\": \"female\",\n   \"source\": \"LL\",\n   \"article\": \"84(10)\",\n   \"certainty\": \"explicit\",\n   \"document_required\": true,\n   \"note\": \"تأمين الأمومة ساري منذ 19 يوليو 2024 للعمانيات والوافدات: صاحب العمل يدفع ويسترد من الصندوق. حقوق إضافية في قانون الحماية الاجتماعية (م129–133): لا يُلزمها بالعودة أثناء الإجازة، انتقال الإجازة للأب عند وفاة الأم، الصرف حتى لو توفي المولود بعد الأسبوع 25، ونفس الإجازة في الحضانة — تحتاج تأكيد من نص القانون.\",\n   \"requires_verification\": true,\n   \"audit_fix\": \"Add spf_reimbursable flag and an employer claim workflow. Under the SPL, the employer may not require a return to work during leave (SPL art.129). If the mother dies, the father is entitled (SPL art.131). The allowance is payable if the child dies after the 25th week (SPL art.131). The same leave applies for fostering a child (SPL art.132). Up to 98 days of extra unpaid childcare leave can be taken within 1 year (SPL art.133); the art.133 detail comes from a secondary source and needs checking.\",\n   \"audit\": \"fixed\"\n  },\n  {\n   \"id\": \"LV-023\",\n   \"module\": \"leave\",\n   \"title_ar\": \"إثبات الإجازات الخاصة\",\n   \"rule_ar\": \"يشترط لمنح الإجازات الخاصة في المادة 84 تقديم ما يثبتها.\",\n   \"logic\": \"proof is a condition of GRANTING (art 84 last para): submit without proof → status pending_proof; approval blocked until a fitting document is attached; deadline = company setting (default_proof_deadline_days)\",\n   \"params\": {\n    \"default_proof_deadline_days\": 7,\n    \"accepted_doc_prefixes\": {\n     \"sick\": [\n      \"medical\"\n     ],\n     \"maternity\": [\n      \"medical\",\n      \"birth_certificate\"\n     ],\n     \"companion\": [\n      \"medical\"\n     ]\n    }\n   },\n   \"type\": \"procedure\",\n   \"applies_to\": \"all\",\n   \"source\": \"LL\",\n   \"article\": \"84\",\n   \"certainty\": \"explicit\",\n   \"audit\": \"approved\",\n   \"certainty_timing\": \"likely\",\n   \"amended_by\": \"docs/legal/backend-assumptions-audit.md (2026-11-01)\"\n  },\n  {\n   \"id\": \"CT-001\",\n   \"module\": \"contract\",\n   \"title_ar\": \"كتابة العقد ولغته\",\n   \"rule_ar\": \"يجب أن يكون العقد مكتوبًا بالعربية من نسختين ومعتمدًا من الجهة المختصة؛ ويجوز بلغة أخرى مع نسخة عربية معتمدة.\",\n   \"logic\": \"contract record: arabic_version required; approval_status\",\n   \"params\": {},\n   \"type\": \"procedure\",\n   \"applies_to\": \"all\",\n   \"source\": \"LL\",\n   \"article\": \"33\",\n   \"certainty\": \"explicit\",\n   \"audit\": \"approved\"\n  },\n  {\n   \"id\": \"CT-002\",\n   \"module\": \"contract\",\n   \"title_ar\": \"مدة العقد المحدد\",\n   \"rule_ar\": \"العقد محدد المدة لا يزيد على 5 سنوات قابلة للتجديد؛ ويعتبر غير محدد المدة في حالات منها تجاوز 5 سنوات أو الاستمرار بعد انتهائه بدون اتفاق كتابي.\",\n   \"logic\": \"block a fixed-term contract longer than 5 years; warn when original term + renewals (all fixed-term contracts with this employer) exceed 5 years → treated as indefinite (art 35)\",\n   \"params\": {\n    \"max_fixed_term_years\": 5\n   },\n   \"type\": \"legal_max\",\n   \"applies_to\": \"all\",\n   \"source\": \"LL\",\n   \"article\": \"34, 35\",\n   \"certainty\": \"explicit\",\n   \"alert\": \"عقد منتهٍ والموظف مستمر بدون تجديد مكتوب\",\n   \"audit\": \"approved\",\n   \"interpretation_ar\": \"المدة التراكمية = مجموع عقود المدة المحددة لدى صاحب العمل نفسه — تفسير\"\n  },\n  {\n   \"id\": \"CT-003\",\n   \"module\": \"contract\",\n   \"title_ar\": \"البيانات الإلزامية في العقد\",\n   \"rule_ar\": \"اسم صاحب العمل والمنشأة وعنوانها، بيانات العامل، نوع العمل وشروطه ومدته، الأجر الأساسي والبدلات وموعد الأداء، مدة الإخطار بعدم التجديد (لا تقل عن شهر من صاحب العمل)، والالتزام باحترام الأديان والقوانين.\",\n   \"logic\": \"contract template required fields validation; non_renewal_notice_by_employer >= 30 days\",\n   \"params\": {\n    \"min_employer_non_renewal_notice_days\": 30\n   },\n   \"type\": \"procedure\",\n   \"applies_to\": \"all\",\n   \"source\": \"LL\",\n   \"article\": \"36\",\n   \"certainty\": \"explicit\",\n   \"audit\": \"approved\"\n  },\n  {\n   \"id\": \"CT-004\",\n   \"module\": \"contract\",\n   \"title_ar\": \"فترة الاختبار\",\n   \"rule_ar\": \"لا تزيد على 3 أشهر لمن أجره شهري وشهرين لغيره، مرة واحدة لدى نفس صاحب العمل، وتدخل في مدة الخدمة عند اجتيازها، ويجوز الإنهاء خلالها بإخطار 7 أيام على الأقل.\",\n   \"logic\": \"probation_max = 3 months (monthly) | 2 months (other); once per employer; termination_notice >= 7 days\",\n   \"params\": {\n    \"max_months_monthly\": 3,\n    \"max_months_other\": 2,\n    \"termination_notice_days\": 7\n   },\n   \"type\": \"legal_max\",\n   \"applies_to\": \"all\",\n   \"source\": \"LL\",\n   \"article\": \"37\",\n   \"certainty\": \"explicit\",\n   \"alert\": \"انتهاء فترة الاختبار خلال 7 أيام\",\n   \"audit\": \"approved\"\n  },\n  {\n   \"id\": \"CT-005\",\n   \"module\": \"contract\",\n   \"title_ar\": \"عدم الاحتفاظ بجواز السفر\",\n   \"rule_ar\": \"لا يجوز لصاحب العمل الاحتفاظ بجواز سفر العامل أو وثائقه إلا بموافقة كتابية منه.\",\n   \"logic\": \"document custody requires written consent record\",\n   \"params\": {},\n   \"type\": \"fixed\",\n   \"applies_to\": \"all\",\n   \"source\": \"LL\",\n   \"article\": \"6\",\n   \"certainty\": \"explicit\",\n   \"audit\": \"approved\"\n  },\n  {\n   \"id\": \"CT-006\",\n   \"module\": \"contract\",\n   \"title_ar\": \"شرط عدم المنافسة\",\n   \"rule_ar\": \"يجوز الاتفاق عليه بشرط تحديد الزمان والمكان ونوع العمل، ولا تزيد المدة على سنتين. ويشترط أن يكون العمل مطلعًا على أسرار العمل أو العملاء، وألا يتجاوز المكان النطاق الجغرافي لنشاط صاحب العمل، ولا يُتمسك به إذا أنهى صاحب العمل العقد دون مبرر من العامل أو وقع منه ما يبرر إنهاء العامل للعقد.\",\n   \"logic\": \"non_compete_duration <= 24 months; must specify scope\",\n   \"params\": {\n    \"max_months\": 24\n   },\n   \"type\": \"legal_max\",\n   \"applies_to\": \"all\",\n   \"source\": \"LL\",\n   \"article\": \"69\",\n   \"certainty\": \"explicit\",\n   \"audit_fix\": \"Add validity conditions (access_to_secrets_or_clients, scope not exceeding the worker's area) and unenforceable_if (employer termination without fault, or justified worker resignation).\",\n   \"audit\": \"fixed\"\n  },\n  {\n   \"id\": \"CT-007\",\n   \"module\": \"contract\",\n   \"title_ar\": \"النقل إلى أجر يومي/أسبوعي\",\n   \"rule_ar\": \"لا يجوز نقل عامل بأجر شهري إلى فئة يومية أو أسبوعية أو بالقطعة أو بالساعة إلا بموافقته كتابة.\",\n   \"logic\": \"pay_type change from monthly requires written consent\",\n   \"params\": {},\n   \"type\": \"procedure\",\n   \"applies_to\": \"monthly_paid\",\n   \"source\": \"LL\",\n   \"article\": \"94\",\n   \"certainty\": \"explicit\",\n   \"audit\": \"approved\"\n  },\n  {\n   \"id\": \"CT-008\",\n   \"module\": \"contract\",\n   \"title_ar\": \"تحديث العقد عند تغيير الأجر\",\n   \"rule_ar\": \"يلتزم صاحب العمل بتحديث عقد العمل عند أي تغيير في أجر العامل ليبين الأجر الفعلي.\",\n   \"logic\": \"on salary change → prompt contract update\",\n   \"params\": {},\n   \"type\": \"procedure\",\n   \"applies_to\": \"all\",\n   \"source\": \"MD729_2024\",\n   \"article\": \"2\",\n   \"certainty\": \"explicit\",\n   \"audit\": \"approved\"\n  },\n  {\n   \"id\": \"TR-001\",\n   \"module\": \"termination\",\n   \"title_ar\": \"مدة الإخطار\",\n   \"rule_ar\": \"للعقد غير محدد المدة: إخطار كتابي 30 يومًا لمن أجره شهري و15 يومًا لغيره، ما لم يتفق على مدة أطول؛ وإلا يُدفع تعويض عن مدة الإخطار بالأجر الشامل. ويشترط وجود سبب مشروع للإنهاء.\",\n   \"logic\": \"notice_days = 30 (monthly) | 15 (other), or contract if longer; pay_in_lieu = gross_daily * remaining\",\n   \"params\": {\n    \"monthly_days\": 30,\n    \"other_days\": 15,\n    \"pay_in_lieu_base\": \"gross\"\n   },\n   \"type\": \"legal_min\",\n   \"applies_to\": \"indefinite_contract\",\n   \"source\": \"LL\",\n   \"article\": \"38\",\n   \"certainty\": \"explicit\",\n   \"audit_fix\": \"Require termination_reason (legitimate) in addition to the 30/15 days notice.\",\n   \"audit\": \"fixed\"\n  },\n  {\n   \"id\": \"TR-002\",\n   \"module\": \"termination\",\n   \"title_ar\": \"الإخطار أثناء الإجازة\",\n   \"rule_ar\": \"لا يبدأ سريان إخطار صاحب العمل للعامل الموجود في إجازة إلا من اليوم التالي لانتهاء الإجازة.\",\n   \"logic\": \"if employee on leave: notice_start = leave_end + 1\",\n   \"params\": {},\n   \"type\": \"fixed\",\n   \"applies_to\": \"all\",\n   \"source\": \"LL\",\n   \"article\": \"39\",\n   \"certainty\": \"explicit\",\n   \"audit\": \"approved\"\n  },\n  {\n   \"id\": \"TR-003\",\n   \"module\": \"termination\",\n   \"title_ar\": \"ساعات البحث عن عمل\",\n   \"rule_ar\": \"خلال مدة الإخطار يُسمح للعامل بالتغيب 10 ساعات مدفوعة أسبوعيًا للبحث عن عمل جديد.\",\n   \"logic\": \"during notice: 10 paid hours/week job-search allowance\",\n   \"params\": {\n    \"hours_per_week\": 10\n   },\n   \"type\": \"legal_min\",\n   \"applies_to\": \"all\",\n   \"source\": \"LL\",\n   \"article\": \"39\",\n   \"certainty\": \"explicit\",\n   \"audit\": \"approved\"\n  },\n  {\n   \"id\": \"TR-004\",\n   \"module\": \"termination\",\n   \"title_ar\": \"حالات الفصل بدون إخطار ولا مكافأة\",\n   \"rule_ar\": \"تسع حالات محددة حصرًا منها: التزوير، الخطأ الجسيم (مع إبلاغ الجهة المختصة خلال 30 يوم عمل)، الغياب، إفشاء الأسرار، الحكم النهائي في جناية، السكر أثناء العمل، الاعتداء، الإخلال الجسيم.\",\n   \"logic\": \"termination_reason enum = art40 cases 1–9; case 2 requires ministry notification within 30 working days\",\n   \"params\": {\n    \"material_loss_notify_working_days\": 30\n   },\n   \"type\": \"procedure\",\n   \"applies_to\": \"all\",\n   \"source\": \"LL\",\n   \"article\": \"40\",\n   \"certainty\": \"explicit\",\n   \"audit\": \"approved\"\n  },\n  {\n   \"id\": \"TR-005\",\n   \"module\": \"termination\",\n   \"title_ar\": \"ترك العامل للعمل مع حقوقه\",\n   \"rule_ar\": \"يجوز للعامل ترك العمل دون إخطار مع كامل حقوقه في حالات منها عدم دفع الأجر أكثر من شهرين متتاليين.\",\n   \"logic\": \"alert if salary unpaid > 2 consecutive months (employee entitled to leave with full rights)\",\n   \"params\": {\n    \"unpaid_months_trigger\": 2\n   },\n   \"type\": \"fixed\",\n   \"applies_to\": \"all\",\n   \"source\": \"LL\",\n   \"article\": \"41\",\n   \"certainty\": \"explicit\",\n   \"alert\": \"رواتب متأخرة شهرين — مخاطرة قانونية عالية\",\n   \"audit\": \"approved\"\n  },\n  {\n   \"id\": \"TR-006\",\n   \"module\": \"termination\",\n   \"title_ar\": \"انتهاء العقد بالمرض\",\n   \"rule_ar\": \"ينتهي العقد إذا انقطع العامل بسبب المرض مدة لا تقل عن 3 أشهر خلال عام، بشرط استنفاد الإجازة المرضية ورصيد الإجازات الاعتيادية.\",\n   \"logic\": \"eligible_termination if sick_absence >= 3 months in year AND sick_leave_exhausted AND annual_balance == 0\",\n   \"params\": {\n    \"months\": 3\n   },\n   \"type\": \"fixed\",\n   \"applies_to\": \"all\",\n   \"source\": \"LL\",\n   \"article\": \"42(4)\",\n   \"certainty\": \"explicit\",\n   \"audit\": \"approved\"\n  },\n  {\n   \"id\": \"TR-007\",\n   \"module\": \"termination\",\n   \"title_ar\": \"الإنهاء لضعف الأداء\",\n   \"rule_ar\": \"بعد إخطار العامل بأوجه عدم الكفاءة ومنحه مهلة لا تقل عن 6 أشهر؛ وإذا كان عمانيًا يشترط تعيين عماني بديل؛ وإخطار الوزارة قبل 3 أشهر من الإنهاء.\",\n   \"logic\": \"performance_termination requires: PIP >= 6 months documented; if omani → omani replacement; notify ministry >= 3 months before\",\n   \"params\": {\n    \"pip_min_months\": 6,\n    \"ministry_notice_months\": 3\n   },\n   \"type\": \"procedure\",\n   \"applies_to\": \"all\",\n   \"source\": \"LL\",\n   \"article\": \"43(3)\",\n   \"certainty\": \"explicit\",\n   \"audit\": \"approved\"\n  },\n  {\n   \"id\": \"TR-008\",\n   \"module\": \"termination\",\n   \"title_ar\": \"التقليص للسبب الاقتصادي\",\n   \"rule_ar\": \"يتطلب موافقة اللجنة المختصة، ومعيارًا عادلًا للاختيار، وإخطارًا لا يقل عن 3 أشهر، وأولوية إعادة التعيين. السبب الاقتصادي = خسارة مالية سنتين متتاليتين.\",\n   \"logic\": \"redundancy workflow: committee_approval; notice >= 3 months; rehire priority flag\",\n   \"params\": {\n    \"notice_months\": 3,\n    \"loss_years\": 2\n   },\n   \"type\": \"procedure\",\n   \"applies_to\": \"all\",\n   \"source\": \"LL\",\n   \"article\": \"1(22), 44, 45, 46\",\n   \"certainty\": \"explicit\",\n   \"audit\": \"approved\"\n  },\n  {\n   \"id\": \"TR-009\",\n   \"module\": \"termination\",\n   \"title_ar\": \"الفصل التعسفي\",\n   \"rule_ar\": \"يحكم بالإعادة أو بتعويض لا يقل عن أجر 3 أشهر ولا يزيد على 12 شهرًا بآخر أجر شامل، إضافة إلى المكافأة وأجر الإخطار والاشتراكات.\",\n   \"logic\": \"risk calculator: compensation range = 3–12 × last gross monthly\",\n   \"params\": {\n    \"min_months\": 3,\n    \"max_months\": 12\n   },\n   \"type\": \"fixed\",\n   \"applies_to\": \"all\",\n   \"source\": \"LL\",\n   \"article\": \"11, 12\",\n   \"certainty\": \"explicit\",\n   \"audit\": \"approved\"\n  },\n  {\n   \"id\": \"TR-010\",\n   \"module\": \"termination\",\n   \"title_ar\": \"مكافأة نهاية الخدمة\",\n   \"rule_ar\": \"للعمال غير المنتفعين بقانون الحماية الاجتماعية: لا تقل عن أجر أساسي شهر عن كل سنة خدمة، وكسور السنة بالنسبة، على أساس آخر أجر أساسي. تسري إلى حين العمل بنظام الادخار.\",\n   \"logic\": \"if not SPF-covered: eosb = last_basic_monthly * gratuity_service_years (pro-rata); days of unpaid leave (art 80) and childcare unpaid leave (art 83) are excluded from gratuity service but kept in length of service\",\n   \"params\": {\n    \"months_per_year\": 1,\n    \"base\": \"last_basic\",\n    \"valid_until\": \"2027-07-19\",\n    \"excluded_leave_codes\": [\n     \"unpaid\",\n     \"childcare_unpaid\"\n    ]\n   },\n   \"type\": \"legal_min\",\n   \"applies_to\": \"non_spf (expat in practice)\",\n   \"source\": \"LL\",\n   \"article\": \"61, 80, 83\",\n   \"certainty\": \"explicit\",\n   \"note\": \"سارية حتى بدء نظام الادخار للوافدين في 19 يوليو 2027 (مؤجل) — برمجها بتاريخ سريان ينهي القاعدة تلقائيًا. تاريخ 19 يوليو 2027 من مصادر ثانوية — يُؤكد من نص المرسوم المعدّل لقانون الحماية الاجتماعية.\",\n   \"requires_verification\": true,\n   \"audit\": \"approved\"\n  },\n  {\n   \"id\": \"TR-011\",\n   \"module\": \"termination\",\n   \"title_ar\": \"موعد صرف المستحقات\",\n   \"rule_ar\": \"فورًا عند انتهاء العلاقة، أو خلال 7 أيام إذا ترك العامل العمل من تلقاء نفسه.\",\n   \"logic\": \"final_settlement_due = termination_date | +7 days if resignation/abandonment\",\n   \"params\": {\n    \"resignation_days\": 7\n   },\n   \"type\": \"legal_max\",\n   \"applies_to\": \"all\",\n   \"source\": \"LL\",\n   \"article\": \"91\",\n   \"certainty\": \"explicit\",\n   \"audit\": \"approved\",\n   \"note\": \"تفسير: «ترك العمل من تلقاء نفسه» يُطبّق على الانقطاع/الترك؛ الاستقالة بإخطار تُصرف مستحقاتها في آخر يوم (أحوط لصاحب العمل).\"\n  },\n  {\n   \"id\": \"TR-012\",\n   \"module\": \"termination\",\n   \"title_ar\": \"شهادة نهاية الخدمة\",\n   \"rule_ar\": \"يلتزم صاحب العمل بتسليم العامل بناء على طلبه ومجانًا شهادة نهاية خدمة، ورد أوراقه وشهاداته.\",\n   \"logic\": \"auto-generate end-of-service certificate on request\",\n   \"params\": {},\n   \"type\": \"procedure\",\n   \"applies_to\": \"all\",\n   \"source\": \"LL\",\n   \"article\": \"62\",\n   \"certainty\": \"explicit\",\n   \"audit\": \"approved\"\n  },\n  {\n   \"id\": \"TR-013\",\n   \"module\": \"termination\",\n   \"title_ar\": \"إعادة العامل غير العماني\",\n   \"rule_ar\": \"يلتزم صاحب العمل بإعادة العامل غير العماني إلى بلده خلال 60 يومًا من انتهاء العقد، ومنحه براءة ذمة عند الطلب.\",\n   \"logic\": \"expat exit task due within 60 days of contract end\",\n   \"params\": {\n    \"days\": 60\n   },\n   \"type\": \"legal_max\",\n   \"applies_to\": \"expat\",\n   \"source\": \"LL\",\n   \"article\": \"14\",\n   \"certainty\": \"explicit\",\n   \"audit\": \"approved\"\n  },\n  {\n   \"id\": \"TR-014\",\n   \"module\": \"termination\",\n   \"title_ar\": \"سقوط المطالبات\",\n   \"rule_ar\": \"يسقط الحق في المطالبة بأي حق بعد سنة من تاريخ استحقاقه.\",\n   \"logic\": \"info: limitation period 1 year\",\n   \"params\": {\n    \"years\": 1\n   },\n   \"type\": \"fixed\",\n   \"applies_to\": \"all\",\n   \"source\": \"LL\",\n   \"article\": \"9\",\n   \"certainty\": \"explicit\",\n   \"audit\": \"approved\"\n  },\n  {\n   \"id\": \"PY-001\",\n   \"module\": \"payroll\",\n   \"title_ar\": \"الدفع عبر نظام حماية الأجور\",\n   \"rule_ar\": \"لا تبرأ ذمة صاحب العمل إلا بتحويل الأجر لحساب العامل في مصرف أو مؤسسة مالية مرخصة، عبر نظام حماية الأجور، خلال 3 أيام من نهاية مدة الاستحقاق.\",\n   \"logic\": \"payroll export in WPS format; flag if transfer_date > period_end + 3 days\",\n   \"params\": {\n    \"max_days_after_period\": 3\n   },\n   \"type\": \"legal_max\",\n   \"applies_to\": \"all\",\n   \"source\": \"LL + MD729_2024\",\n   \"article\": \"LL 87, 90; MD729 art 3\",\n   \"certainty\": \"explicit\",\n   \"alert\": \"اقتراب موعد 3 أيام لتحويل الرواتب\",\n   \"audit\": \"approved\"\n  },\n  {\n   \"id\": \"PY-002\",\n   \"module\": \"payroll\",\n   \"title_ar\": \"استثناءات حماية الأجور\",\n   \"rule_ar\": \"يستثنى من التحويل عبر النظام: نزاع عمالي أوقف العامل أكثر من 30 يومًا، توقيف لسبب لا يعود لصاحب العمل أكثر من 30 يومًا، بلاغ ترك عمل مضى عليه أكثر من 30 يومًا، عامل جديد لم يكمل 30 يومًا، عامل في إجازة بدون أجر.\",\n   \"logic\": \"wps_exempt if any of 5 conditions\",\n   \"params\": {\n    \"threshold_days\": 30\n   },\n   \"type\": \"fixed\",\n   \"applies_to\": \"all\",\n   \"source\": \"MD729_2024\",\n   \"article\": \"5\",\n   \"certainty\": \"explicit\",\n   \"audit\": \"approved\"\n  },\n  {\n   \"id\": \"PY-003\",\n   \"module\": \"payroll\",\n   \"title_ar\": \"تكرار الدفع\",\n   \"rule_ar\": \"العمال بأجر شهري تؤدى أجورهم مرة على الأقل كل شهر.\",\n   \"logic\": \"monthly payroll cycle min 1/month\",\n   \"params\": {},\n   \"type\": \"legal_min\",\n   \"applies_to\": \"monthly_paid\",\n   \"source\": \"LL\",\n   \"article\": \"90\",\n   \"certainty\": \"explicit\",\n   \"audit\": \"approved\"\n  },\n  {\n   \"id\": \"PY-004\",\n   \"module\": \"payroll\",\n   \"title_ar\": \"الحد الأدنى لأجور العمانيين\",\n   \"rule_ar\": \"325 ر.ع شهريًا (225 أجر أساسي + 100 بدلات) للعمانيين في القطاع الخاص.\",\n   \"logic\": \"if nationality == OM and full_time: block basic < 225 or gross < 325\",\n   \"params\": {\n    \"min_basic\": 225,\n    \"min_allowances\": 100,\n    \"min_gross\": 325,\n    \"currency\": \"OMR\"\n   },\n   \"type\": \"legal_min\",\n   \"applies_to\": \"omani\",\n   \"source\": \"MD222_2013\",\n   \"article\": \"-\",\n   \"certainty\": \"explicit\",\n   \"note\": \"تم التأكد من القرار 222/2013، ولا يوجد قرار أحدث في بحث 2025–2026.\",\n   \"requires_verification\": false,\n   \"audit\": \"approved\"\n  },\n  {\n   \"id\": \"PY-005\",\n   \"module\": \"payroll\",\n   \"title_ar\": \"العلاوة الدورية السنوية للعمانيين\",\n   \"rule_ar\": \"تُستحق في 1 يناير لمن أمضى 6 أشهر على الأقل، حسب التقييم كحد أدنى: ممتاز 5%، جيد جدًا 4%، جيد 3%، مقبول 2%، ضعيف 0% من الأجر الأساسي.\",\n   \"logic\": \"on Jan 1: if OM and service >= 6m: increment = basic * {excellent:0.05, very_good:0.04, good:0.03, acceptable:0.02, weak:0}\",\n   \"params\": {\n    \"effective\": \"01-01\",\n    \"min_service_months\": 6,\n    \"rates\": {\n     \"excellent\": 0.05,\n     \"very_good\": 0.04,\n     \"good\": 0.03,\n     \"acceptable\": 0.02,\n     \"weak\": 0\n    }\n   },\n   \"type\": \"legal_min\",\n   \"applies_to\": \"omani\",\n   \"source\": \"MD317_2025\",\n   \"article\": \"2\",\n   \"certainty\": \"explicit\",\n   \"note\": \"يتطلب وحدة تقييم أداء بخمس درجات بنفس المسميات؛ للعامل حق التظلم من التقييم للوزارة\",\n   \"audit\": \"approved\"\n  },\n  {\n   \"id\": \"PY-006\",\n   \"module\": \"payroll\",\n   \"title_ar\": \"إيقاف العلاوة الدورية\",\n   \"rule_ar\": \"يجوز إيقافها إذا كان العامل محالًا للتحقيق في جنحة/جناية داخل مكان العمل (تُصرف بأثر رجعي عند البراءة)، أو قضى إجازة بدون أجر (م80، م83) أو انقطع أكثر من 6 أشهر في سنة الاحتساب. ويجوز تخفيضها للسبب الاقتصادي بموافقة اللجنة.\",\n   \"logic\": \"increment_hold if under_investigation | unpaid_leave(80,83) | absence > 6 months; reduction requires committee approval\",\n   \"params\": {\n    \"absence_months\": 6\n   },\n   \"type\": \"fixed\",\n   \"applies_to\": \"omani\",\n   \"source\": \"MD317_2025\",\n   \"article\": \"4, 5\",\n   \"certainty\": \"explicit\",\n   \"audit\": \"approved\"\n  },\n  {\n   \"id\": \"PY-007\",\n   \"module\": \"payroll\",\n   \"title_ar\": \"الاقتطاع عن الإتلاف\",\n   \"rule_ar\": \"بعد التحقيق وإخطار العامل، يجوز اقتطاع قيمة الإتلاف العمدي من الأجر الشامل بما لا يزيد على 25% شهريًا.\",\n   \"logic\": \"damage_deduction_month <= 0.25 * gross; requires investigation record\",\n   \"params\": {\n    \"max_pct_month\": 0.25\n   },\n   \"type\": \"legal_max\",\n   \"applies_to\": \"all\",\n   \"source\": \"LL\",\n   \"article\": \"68\",\n   \"certainty\": \"explicit\",\n   \"audit\": \"approved\"\n  },\n  {\n   \"id\": \"PY-008\",\n   \"module\": \"payroll\",\n   \"title_ar\": \"السلف\",\n   \"rule_ar\": \"لا يقتطع وفاء للسلفة أكثر من المتفق عليه، ولا يجوز تقاضي أي فوائد.\",\n   \"logic\": \"loan module: interest = 0; deduction per agreement\",\n   \"params\": {\n    \"interest\": 0\n   },\n   \"type\": \"fixed\",\n   \"applies_to\": \"all\",\n   \"source\": \"LL\",\n   \"article\": \"95\",\n   \"certainty\": \"explicit\",\n   \"audit\": \"approved\"\n  },\n  {\n   \"id\": \"PY-009\",\n   \"module\": \"payroll\",\n   \"title_ar\": \"الحد الأقصى للحجز على الأجر\",\n   \"rule_ar\": \"لا يجوز الحجز أو التنازل عن الأجور إلا في حدود الربع، لدين نفقة شرعية أو مستحقات للحكومة أو لصاحب العمل، والأولوية للنفقة.\",\n   \"logic\": \"total_garnishment <= 0.25 * wage; priority: alimony first\",\n   \"params\": {\n    \"max_pct\": 0.25\n   },\n   \"type\": \"legal_max\",\n   \"applies_to\": \"all\",\n   \"source\": \"LL\",\n   \"article\": \"96\",\n   \"certainty\": \"explicit\",\n   \"audit\": \"approved\"\n  },\n  {\n   \"id\": \"PY-010\",\n   \"module\": \"payroll\",\n   \"title_ar\": \"عبء إثبات دفع الأجر\",\n   \"rule_ar\": \"يقع عبء إثبات الوفاء بالأجر على صاحب العمل.\",\n   \"logic\": \"store immutable payment proof per payroll run\",\n   \"params\": {},\n   \"type\": \"procedure\",\n   \"applies_to\": \"employer\",\n   \"source\": \"LL\",\n   \"article\": \"86\",\n   \"certainty\": \"explicit\",\n   \"audit\": \"approved\"\n  },\n  {\n   \"id\": \"DS-001\",\n   \"module\": \"discipline\",\n   \"title_ar\": \"لائحة الجزاءات\",\n   \"rule_ar\": \"إلزامية للمنشآت التي تشغّل 25 عاملًا فأكثر وفق النموذج الوزاري، وتُطبق أحكام النموذج على من لا يملك لائحة معتمدة. ووفق النموذج: لا يُنفذ الجزاء قبل 3 أيام من الإخطار الكتابي، وللعامل التظلم خلال 3 أيام، ويرد صاحب العمل خلال 7 أيام.\",\n   \"logic\": \"if headcount >= 25: require approved penalty policy; else default ministerial model; written notice of the penalty; execution held 3 days after notice EXCEPT art 40(3)/(7) dismissals; grievance within 3 days, decided within 7 days\",\n   \"params\": {\n    \"headcount_threshold\": 25,\n    \"execute_after_days\": 3,\n    \"appeal_days\": 3,\n    \"employer_reply_days\": 7,\n    \"no_hold_art40_items\": [\n     3,\n     7\n    ]\n   },\n   \"type\": \"procedure\",\n   \"applies_to\": \"employer\",\n   \"source\": \"LL + MD618_2024\",\n   \"article\": \"LL 55\",\n   \"certainty\": \"explicit\",\n   \"audit_fix\": \"Source: https://qanoon.om/p/2024/mol20240618/. Add: a penalty may not be carried out until 3 days after written notice; the worker may appeal within 3 days and the employer decides within 7; a repeat after 6 months counts as a first offence; the model's penalties are maximums.\",\n   \"audit\": \"fixed\",\n   \"amended_by\": \"docs/legal/backend-assumptions-audit.md (2026-11-01)\"\n  },\n  {\n   \"id\": \"DS-002\",\n   \"module\": \"discipline\",\n   \"title_ar\": \"التحقيق قبل الجزاء\",\n   \"rule_ar\": \"لا يوقع جزاء إلا بعد إبلاغ العامل كتابة وسماع أقواله وتدوين دفاعه في محضر، وللعامل الاطلاع على الإجراءات والحصول على نسخة؛ والمحقق لا يقل مستواه عن مستوى العامل.\",\n   \"logic\": \"penalty workflow: written charge → hearing → minutes → decision; investigator_level >= employee_level\",\n   \"params\": {},\n   \"type\": \"procedure\",\n   \"applies_to\": \"all\",\n   \"source\": \"LL\",\n   \"article\": \"63, 66\",\n   \"certainty\": \"explicit\",\n   \"audit\": \"approved\"\n  },\n  {\n   \"id\": \"DS-003\",\n   \"module\": \"discipline\",\n   \"title_ar\": \"مهل المساءلة\",\n   \"rule_ar\": \"لا مساءلة عن مخالفة مضى على كشفها أكثر من 30 يومًا، ولا يوقع جزاء بعد ثبوت المخالفة بأكثر من 60 يومًا.\",\n   \"logic\": \"block if today - discovery_date > 30 (open case) or today - proven_date > 60 (issue penalty)\",\n   \"params\": {\n    \"case_open_days\": 30,\n    \"penalty_issue_days\": 60\n   },\n   \"type\": \"legal_max\",\n   \"applies_to\": \"all\",\n   \"source\": \"LL\",\n   \"article\": \"64\",\n   \"certainty\": \"explicit\",\n   \"alert\": \"عدّاد تنازلي لمهل 30/60 يومًا\",\n   \"audit\": \"approved\"\n  },\n  {\n   \"id\": \"DS-004\",\n   \"module\": \"discipline\",\n   \"title_ar\": \"حدود الغرامة والإيقاف\",\n   \"rule_ar\": \"الغرامة عن المخالفة الواحدة لا تزيد على أجر 5 أيام في الشهر، والإيقاف مع الحرمان من الأجر لا يزيد على 5 أيام في الشهر.\",\n   \"logic\": \"fine <= 5 days wage/month per violation; suspension_unpaid <= 5 days/month\",\n   \"params\": {\n    \"max_fine_days\": 5,\n    \"max_suspension_days\": 5\n   },\n   \"type\": \"legal_max\",\n   \"applies_to\": \"all\",\n   \"source\": \"LL\",\n   \"article\": \"65\",\n   \"certainty\": \"explicit\",\n   \"audit\": \"approved\"\n  },\n  {\n   \"id\": \"DS-005\",\n   \"module\": \"discipline\",\n   \"title_ar\": \"قواعد اللائحة\",\n   \"rule_ar\": \"جزاءات تصاعدية، جزاء واحد فقط للمخالفة الواحدة، ولا جزاء عن فعل خارج العمل إلا إذا كان له علاقة بالعمل.\",\n   \"logic\": \"one penalty per violation; escalating ladder\",\n   \"params\": {},\n   \"type\": \"fixed\",\n   \"applies_to\": \"all\",\n   \"source\": \"LL\",\n   \"article\": \"56\",\n   \"certainty\": \"explicit\",\n   \"audit\": \"approved\"\n  },\n  {\n   \"id\": \"DS-006\",\n   \"module\": \"discipline\",\n   \"title_ar\": \"نظام الشكاوى والتظلمات\",\n   \"rule_ar\": \"إلزامي للمنشآت التي تشغّل 50 عاملًا فأكثر بعد اعتماده من الجهة المختصة، مع تمكين العامل من نسخة معتمدة.\",\n   \"logic\": \"if headcount >= 50: enable grievance module\",\n   \"params\": {\n    \"headcount_threshold\": 50\n   },\n   \"type\": \"procedure\",\n   \"applies_to\": \"employer\",\n   \"source\": \"LL\",\n   \"article\": \"8\",\n   \"certainty\": \"explicit\",\n   \"audit\": \"approved\"\n  },\n  {\n   \"id\": \"DS-007\",\n   \"module\": \"discipline\",\n   \"title_ar\": \"لائحة نظام العمل\",\n   \"rule_ar\": \"إلزامية للمنشآت التي تشغّل 50 عاملًا فأكثر، تعتمدها الوزارة خلال شهرين وإلا أصبحت نافذة.\",\n   \"logic\": \"if headcount >= 50: require work regulations doc\",\n   \"params\": {\n    \"headcount_threshold\": 50\n   },\n   \"type\": \"procedure\",\n   \"applies_to\": \"employer\",\n   \"source\": \"LL\",\n   \"article\": \"54\",\n   \"certainty\": \"explicit\",\n   \"audit\": \"approved\"\n  },\n  {\n   \"id\": \"RC-001\",\n   \"module\": \"records\",\n   \"title_ar\": \"ملف العامل\",\n   \"rule_ar\": \"ملف خاص لكل عامل يتضمن: بياناته الشخصية، مهنته ومؤهلاته، تاريخ المباشرة والأجر، الإجازات، الجزاءات، تقارير الأداء، تاريخ وأسباب انتهاء الخدمة؛ يُحفظ سنة على الأقل بعد الانتهاء مع الحفاظ على السرية.\",\n   \"logic\": \"retention classes: employee_file >= 1 year after exit (art 52); payroll_records configurable, NO purge until a lawyer/accountant confirms the period; audit per company setting; legal_hold overrides every class\",\n   \"params\": {\n    \"retention_years_after_exit\": 1,\n    \"classes\": {\n     \"employee_file\": {\n      \"min_years\": 1,\n      \"basis\": \"LL 52\"\n     },\n     \"payroll_records\": {\n      \"min_years\": null,\n      \"purge_requires_confirmation\": true,\n      \"basis\": \"needs_lawyer\"\n     },\n     \"audit\": {\n      \"default_months\": 24,\n      \"min_months\": 12,\n      \"basis\": \"config\"\n     }\n    }\n   },\n   \"type\": \"legal_min\",\n   \"applies_to\": \"all\",\n   \"source\": \"LL\",\n   \"article\": \"52\",\n   \"certainty\": \"explicit\",\n   \"audit\": \"approved\",\n   \"needs_lawyer\": [\n    \"classes.payroll_records\"\n   ],\n   \"amended_by\": \"docs/legal/backend-assumptions-audit.md (2026-11-01)\"\n  },\n  {\n   \"id\": \"RC-002\",\n   \"module\": \"records\",\n   \"title_ar\": \"لغة اللوائح والتعاميم\",\n   \"rule_ar\": \"العربية هي اللغة الواجبة في لوائح وقرارات وتعاميم صاحب العمل، والنص العربي هو المعتمد.\",\n   \"logic\": \"all policy/circular templates must have Arabic version (authoritative)\",\n   \"params\": {},\n   \"type\": \"fixed\",\n   \"applies_to\": \"employer\",\n   \"source\": \"LL\",\n   \"article\": \"7\",\n   \"certainty\": \"explicit\",\n   \"audit\": \"approved\"\n  },\n  {\n   \"id\": \"RW-001\",\n   \"module\": \"remote_work\",\n   \"title_ar\": \"نطاق العمل عن بعد\",\n   \"rule_ar\": \"كلي أو جزئي، من خارج مقر المنشأة داخل سلطنة عمان؛ ويحظر التعاقد للعمل عن بعد مع عامل خارج عمان.\",\n   \"logic\": \"flag in_oman=false; HR review; alert on repetition\",\n   \"params\": {\n    \"abroad_alert_days\": 3,\n    \"abroad_window_days\": 30\n   },\n   \"type\": \"fixed\",\n   \"applies_to\": \"remote\",\n   \"source\": \"MD523_2025\",\n   \"article\": \"2\",\n   \"certainty\": \"explicit\",\n   \"audit\": \"approved\",\n   \"logic_certainty\": \"likely\",\n   \"needs_lawyer\": [\n    \"abroad_alert_days\",\n    \"abroad_window_days\"\n   ],\n   \"gray_area_ar\": \"النص يحظر التعاقد مع عامل خارج عمان ولا يحدد حدًا لتسجيلات الحضور من الخارج؛ تنبيه الموارد البشرية عند 3 أيام خلال 30 يومًا خيار مؤقت يحتاج محاميًا\",\n   \"amended_by\": \"docs/legal/backend-assumptions-audit.md (2026-11-01)\"\n  },\n  {\n   \"id\": \"RW-002\",\n   \"module\": \"remote_work\",\n   \"title_ar\": \"التزامات المنشأة في العمل عن بعد\",\n   \"rule_ar\": \"قائمة بالعاملين عن بعد، توفير الأدوات وتحمل تكاليفها (ما لم يتفق خلافه)، منح الصلاحيات، ونظام إلكتروني للإشراف وتقييم الأداء.\",\n   \"logic\": \"remote register report; equipment assignment; performance tracking\",\n   \"params\": {},\n   \"type\": \"procedure\",\n   \"applies_to\": \"employer\",\n   \"source\": \"MD523_2025\",\n   \"article\": \"3\",\n   \"certainty\": \"explicit\",\n   \"audit\": \"approved\"\n  },\n  {\n   \"id\": \"RW-003\",\n   \"module\": \"remote_work\",\n   \"title_ar\": \"حظر المراقبة المنتهكة للخصوصية\",\n   \"rule_ar\": \"يحظر استخدام أنظمة مراقبة تنتهك خصوصية العامل أو استخدام بياناته الشخصية لغير أغراض العمل.\",\n   \"logic\": \"privacy: no screen/keystroke/camera surveillance without lawful basis; purpose limitation\",\n   \"params\": {},\n   \"type\": \"fixed\",\n   \"applies_to\": \"remote\",\n   \"source\": \"MD523_2025\",\n   \"article\": \"4\",\n   \"certainty\": \"explicit\",\n   \"note\": \"مهم لتصميم ميزات تتبع الموقع/الحضور عن بعد\",\n   \"audit\": \"approved\"\n  },\n  {\n   \"id\": \"PT-001\",\n   \"module\": \"part_time\",\n   \"title_ar\": \"العمل لبعض الوقت\",\n   \"rule_ar\": \"مقصور على العمانيين؛ لا يقل عن 4 ساعات يوميًا ولا يتجاوز 25 ساعة أسبوعيًا؛ أجر الساعة لا يقل عن 3 ر.ع (ويجوز أقل بموافقة الوزارة)؛ من العاملين أو الباحثين عن عمل أو الطلبة أو المتقاعدين.\",\n   \"logic\": \"if contract_type == part_time: daily_hours, weekly_hours and hourly_wage are REQUIRED on the contract; nationality == OM; 4 <= daily_hours; weekly_hours <= 25; hourly_wage >= 3 OMR unless ministry_approval\",\n   \"params\": {\n    \"min_daily_hours\": 4,\n    \"max_weekly_hours\": 25,\n    \"min_hourly_wage_omr\": 3\n   },\n   \"type\": \"legal_min\",\n   \"applies_to\": \"omani_part_time\",\n   \"source\": \"MD13_2025\",\n   \"article\": \"3\",\n   \"certainty\": \"explicit\",\n   \"audit\": \"approved\",\n   \"amended_by\": \"docs/legal/backend-assumptions-audit.md (2026-11-01)\"\n  },\n  {\n   \"id\": \"MN-001\",\n   \"module\": \"minors\",\n   \"title_ar\": \"تشغيل الأحداث\",\n   \"rule_ar\": \"يحظر التشغيل دون 15 سنة؛ الحدث (15–18): لا يعمل بين 6 مساءً و6 صباحًا، ولا أكثر من 6 ساعات يوميًا، ولا إضافي، ولا في أيام الراحة والعطل، وموافقة ولي الأمر وفحص طبي. ولا يبقى في مكان العمل أكثر من 7 ساعات متصلة، ولا يعمل أكثر من 4 ساعات متواصلة، مع فحص طبي قبل التشغيل وبشكل دوري، وسجل للأحداث، وإخطار الجهة المختصة قبل تشغيلهم.\",\n   \"logic\": \"if age < 15: block; if 15<=age<18: max_daily=6, no OT, no night (18:00–06:00), no rest-day work, guardian consent required\",\n   \"params\": {\n    \"min_age\": 15,\n    \"minor_max_daily_hours\": 6,\n    \"minor_night_start\": \"18:00\",\n    \"minor_night_end\": \"06:00\",\n    \"max_presence_hours\": 7,\n    \"max_continuous_hours\": 4\n   },\n   \"type\": \"legal_max\",\n   \"applies_to\": \"minor\",\n   \"source\": \"LL\",\n   \"article\": \"98, 99, 100, 101\",\n   \"certainty\": \"explicit\",\n
