/* ---------- sidebar ---------- */
#sidebar{width:272px;flex:0 0 272px;background:#fff;display:flex;flex-direction:column;height:100vh;border-inline-start:1px solid var(--line);box-shadow:-2px 0 8px rgba(0,0,0,.03);z-index:5}
.sb-head{background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;padding:14px 16px;height:84px;flex:0 0 84px}
.sb-logo{width:48px;height:48px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:800;color:var(--navy);letter-spacing:.3px;flex:0 0 48px;direction:ltr}
.sb-logo b{color:#c8102e}
.sb-title{font-weight:800;font-size:15.5px;line-height:1.3}
.sb-sub{font-size:11px;opacity:.75}
.sb-nav{flex:1;overflow-y:auto;padding:10px 10px 10px 12px;scrollbar-width:thin}
.sb-sec{font-size:12px;color:var(--muted);padding:14px 8px 4px;font-weight:500}
.sb-item{display:flex;align-items:center;gap:12px;height:50px;padding:0 12px;margin:6px 0;border-radius:12px;color:#3a4252;cursor:pointer;font-size:14px;position:relative;border:1px solid transparent;text-decoration:none}
.sb-item:hover{background:#f8f6f3}
.sb-ic{width:32px;height:32px;border-radius:9px;background:#f6f3f1;display:flex;align-items:center;justify-content:center;color:#5d6778;flex:0 0 32px}
.sb-ic .mi{font-size:18px}
.sb-label{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-item.active{background:var(--blue-l);border-color:var(--blue-b);color:var(--navy);font-weight:700}
.sb-item.active .sb-ic{background:#ece1d8;color:var(--navy)}
.sb-item.active::after{content:"";position:absolute;inset-inline-start:3px;top:14px;bottom:14px;width:3px;border-radius:3px;background:var(--navy)}
.sb-item.active .sb-label{padding-inline-start:6px}
.badge-new{font-size:8.5px;font-weight:800;color:#fff;background:#43a047;border-radius:10px;padding:2px 7px;letter-spacing:.3px}
.badge-new.o{background:#f5a623}
.sb-group>.sb-item{font-weight:700;color:#3b3630}
.sb-group>.sb-item .chev{color:#6b7484;transition:transform .2s}
.sb-group.open>.sb-item .chev{transform:rotate(180deg)}
.sb-group.open>.sb-item{background:#f9f8f6;border-color:#edeae6}
.sb-sub-items{display:none;padding-inline-start:12px}
.sb-group.open .sb-sub-items{display:block}
.sb-sub-items .sb-item{height:46px;margin:4px 0}
.sb-sub-items .sb-ic{background:transparent;width:26px;height:26px;flex-basis:26px}
.sb-lang{display:flex;align-items:center;gap:10px;padding:10px 14px;margin:6px 4px;background:#f9f8f6;border-radius:10px;font-size:12px}
.sb-foot{padding:10px;border-top:1px solid var(--line);flex:0 0 auto}
.user-card{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;position:relative}
.user-av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#b47846,#654324);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex:0 0 34px}
.user-name{font-weight:700;font-size:13.5px}
.user-mail{font-size:11px;color:var(--muted)}
.logout{margin-top:10px;width:100%;height:44px;border-radius:10px;border:1px solid #f4b3bb;background:var(--red-l);color:var(--red);display:flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:13.5px}
.viewer-menu{position:absolute;bottom:100%;inset-inline:0;margin-bottom:6px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:6px;display:none;z-index:50}
.viewer-menu.open{display:block}
.viewer-menu .vm-t{font-size:10px;color:var(--muted);padding:4px 8px}
.viewer-menu button{display:flex;width:100%;gap:8px;align-items:center;background:none;border:0;padding:8px;border-radius:8px;text-align:start;font-size:12px}
.viewer-menu button:hover,.viewer-menu button.on{background:var(--blue-l);color:var(--navy)}

/* ---------- main ---------- */
#col{flex:1;min-width:0;height:100vh;display:flex;flex-direction:column}
#main{flex:1;min-width:0;min-height:0;overflow-y:auto;overflow-x:hidden;position:relative}
.page{padding:24px 24px 48px;min-width:0}
.topbar{margin:10px 24px 0;background:linear-gradient(270deg,#654324 0%,#56391f 60%,#4f351e 100%);color:#fff;border-radius:4px;height:82px;display:flex;align-items:center;gap:14px;padding:0 22px;position:relative;z-index:1;box-shadow:0 4px 14px rgba(79, 53, 30,.25)}
.topbar .tb-ic{width:42px;height:42px;border-radius:9px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center}
.topbar h1{font-size:22px;margin:0;font-weight:800}
.topbar .tb-sub{font-size:12px;opacity:.8}
.topbar .sp{flex:1}
.tb-btn{width:36px;height:36px;border-radius:8px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.14);color:#fff;display:flex;align-items:center;justify-content:center}
.tb-clock{font-weight:800;font-size:17px;direction:ltr;text-align:end}
.tb-clock small{display:block;font-size:10.5px;font-weight:400;opacity:.8}

.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);border:1px solid #f2f0ed}
.card.p{padding:20px}
.phead{background:#fff;border-radius:var(--r);box-shadow:var(--sh);border-top:3px solid var(--navy);padding:20px 22px;margin-bottom:20px}
.phead-row{display:flex;align-items:center;gap:12px}
.ph-ic{width:44px;height:44px;border-radius:12px;background:var(--blue-l);color:var(--navy);display:flex;align-items:center;justify-content:center;flex:0 0 44px}
.ph-title{font-size:24px;font-weight:800;margin:0;line-height:1.3}
.ph-sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.ph-actions{margin-inline-start:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{height:38px;padding:0 16px;border-radius:9px;border:1px solid var(--navy);background:var(--navy);color:#fff;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn.l{background:#fff;color:#3a4252;border-color:var(--line)}
.btn.g{background:var(--green);border-color:var(--green)}
.btn.r{background:var(--red);border-color:var(--red)}
.btn.o{background:#fff;color:var(--navy);border-color:var(--navy)}
.btn.bl{background:#b3793c;border-color:#b3793c}
.btn.sm{height:30px;padding:0 12px;font-size:12px}
.btn.full{width:100%;justify-content:center;height:42px}
.btn[disabled]{opacity:.45;cursor:default}
.lnk{background:none;border:0;color:var(--muted);font-weight:700;padding:0 10px}
.search{display:flex;align-items:center;gap:8px;height:44px;border:1px solid var(--line);border-radius:9px;background:#fbf9f8;padding:0 12px;margin-top:12px}
.search input{border:0;background:transparent;outline:0;flex:1;min-width:0;font-size:13px}
.search .mi{color:var(--muted)}
.row{display:flex;gap:12px;align-items:center}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.mt{margin-top:14px}.mb{margin-bottom:14px}
.muted{color:var(--muted)}.small{font-size:12px}
.ltr{direction:ltr;unicode-bidi:isolate}

.tabs{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.tab{height:36px;padding:0 18px;border-radius:18px;border:1px solid var(--line);background:#fff;font-size:12.5px;color:#59616f}
.tab.on{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:700}
.utabs{display:flex;gap:22px;border-bottom:1px solid var(--line2);margin-top:10px}
.utab{background:none;border:0;padding:10px 2px;font-size:12.5px;color:var(--muted);border-bottom:2px solid transparent}
.utab.on{color:var(--navy);border-color:var(--navy);font-weight:700}
.segs{display:flex;background:#f6f3f1;border-radius:10px;padding:3px;gap:3px}
.seg{flex:1;height:42px;border:0;border-radius:9px;background:transparent;font-size:13px;color:#4b5462}
.seg.on{background:var(--navy);color:#fff;font-weight:700}
.segs.w .seg.on{background:#fff;color:var(--navy);box-shadow:0 1px 4px rgba(0,0,0,.08)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:20px}
.kpi{background:#fff;border-radius:var(--r);box-shadow:var(--sh);border:1px solid #f2f0ed;padding:16px 18px;display:flex;align-items:center;gap:12px;min-height:80px}
.kpi .k-ic{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:0 0 38px}
.kpi .k-l{font-size:12px;color:var(--muted)}
.kpi .k-v{font-size:20px;font-weight:800;margin-inline-start:auto}
.kpi .k-s{font-size:11px}
.c-green{background:var(--green-l);color:var(--green)} .c-red{background:var(--red-l);color:var(--red)} .c-orange{background:var(--orange-l);color:var(--orange)}
.c-blue{background:var(--blue-l);color:var(--navy)} .c-purple{background:var(--purple-l);color:var(--purple)} .c-cyan{background:var(--cyan-l);color:var(--cyan)} .c-grey{background:#eef0f3;color:#6b7484}

/* table */
.tbl-wrap{background:#fff;border-radius:var(--r);box-shadow:var(--sh);border:1px solid #f2f0ed;overflow:auto}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th{font-weight:500;color:#59616f;text-align:start;padding:14px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:#fff;position:sticky;top:0}
table.t th .th{display:flex;align-items:center;gap:4px}
table.t th .th-ic{display:inline-flex;gap:0;color:#8a93a1;margin-inline-start:auto}
table.t th .th-ic .mi{font-size:14px;cursor:pointer;padding:1px}
table.t th .th-ic .mi.on{color:var(--navy)}
table.t td{padding:14px 10px;border-bottom:1px solid var(--line2);vertical-align:middle}
table.t tr:hover td{background:#fbf9f8}
table.t.fixed{table-layout:fixed}
table.t.fixed td,table.t.fixed th{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
tr.absent td{background:#fdecee!important}
.chip{display:inline-flex;align-items:center;gap:3px;height:24px;padding:0 10px;border-radius:12px;font-size:11px;font-weight:700;white-space:nowrap}
.chip .mi{font-size:12px}
.ibtn{width:30px;height:30px;border-radius:7px;border:1px solid var(--line);background:#fff;display:inline-flex;align-items:center;justify-content:center;color:#5d6778;padding:0;margin:0 1px}
.ibtn .mi{font-size:17px}
.ibtn.green{background:var(--green-l);color:var(--green);border-color:#bfe9d2}
.ibtn.red{background:var(--red-l);color:var(--red);border-color:#f5c2c9}
.ibtn.blue{background:var(--blue-l);color:var(--navy);border-color:var(--blue-b)}
.ibtn.orange{background:var(--orange-l);color:var(--orange);border-color:#f7dcae}
.ibtn.yellow{background:#fff8e1;color:#e0a800;border-color:#f6e3a0}
.ibtn.cyan{background:var(--cyan-l);color:var(--cyan);border-color:#eadbd4}
.ibtn.purple{background:var(--purple-l);color:var(--purple);border-color:#e0c9ef}
.av{width:36px;height:36px;border-radius:50%;background:var(--navy);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:0 0 36px}
.av.lg{width:54px;height:54px;font-size:19px;flex-basis:54px}
.av.xl{width:96px;height:96px;font-size:34px;flex-basis:96px;border:3px solid rgba(255,255,255,.85)}
.av.sq{border-radius:10px;background:#f3f1ee;color:#8a93a1}
.namecell{display:flex;align-items:center;gap:8px}
.namecell .n{font-weight:700;font-size:12.5px}
.namecell .e{font-size:11px;color:var(--muted)}
.pager{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:10px 14px;font-size:11px;color:#59616f;direction:ltr}
.pager .pg{width:24px;height:24px;border-radius:50%;background:var(--navy);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:11px}

.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:60px 20px;color:var(--muted)}
.empty .mi{font-size:46px;color:#b5bcc8;margin-bottom:10px}
.empty .e-t{font-size:15px;font-weight:700;color:#4b5462}
.empty .e-s{font-size:12px;margin-top:4px}
.empty-card{background:#fff;border-radius:14px;box-shadow:var(--sh);border:1px solid #f2f0ed;padding:30px 40px;max-width:360px;margin:60px auto;text-align:center}
.empty-card .ring{width:66px;height:66px;border-radius:50%;border:2px solid currentColor;display:flex;align-items:center;justify-content:center;margin:0 auto 12px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.sec-t{display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px;margin-bottom:12px}
.sec-t .ic{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.info{display:flex;align-items:center;gap:12px;background:#f9f8f6;border:1px solid #f3f1ee;border-radius:12px;padding:13px 14px;margin-bottom:8px}
.info .i-ic{width:32px;height:32px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex:0 0 32px}
.info .i-l{font-size:11px;color:var(--muted)}
.info .i-v{font-size:13px;font-weight:700}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;font-size:12.5px}
.kv .k{color:var(--muted)}
.banner{display:flex;gap:8px;align-items:flex-start;padding:12px 16px;border-radius:10px;font-size:12.5px;margin-bottom:14px;line-height:1.7}
.banner.blue{background:#f7f0e9;border:1px solid #e9d8c9;color:#765436}
.banner.yellow{background:#fff8e1;border:1px solid #f6e3a0;color:#8a6d00}

/* dialogs */
.ov{position:fixed;inset:0;background:rgba(31, 27, 22,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;animation:fi .15s}
@keyframes fi{from{opacity:0}to{opacity:1}}
.dlg{background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.25);width:440px;max-width:100%;max-height:calc(100vh - 40px);display:flex;flex-direction:column;overflow:hidden}
.dlg.w5{width:520px}.dlg.w6{width:620px}.dlg.w7{width:720px}.dlg.w9{width:900px}.dlg.wx{width:1000px}
.dlg-h{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line2)}
.dlg-h.blue{background:linear-gradient(270deg,#654324,#885c35);color:#fff;border:0}
.dlg-h.royal{background:linear-gradient(270deg,#775a39,#bd8349);color:#fff;border:0}
.dlg-h.green{background:#e7f7ee;border:0}
.dlg-h.red{background:linear-gradient(270deg,#d84b5a,#e86a5b);color:#fff;border:0}
.dlg-h.purple{background:linear-gradient(270deg,#947342,#7c64d8);color:#fff;border:0}
.dlg-h .d-ic{width:32px;height:32px;border-radius:9px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center}
.dlg-h:not(.blue):not(.royal):not(.red):not(.purple) .d-ic{background:var(--blue-l);color:var(--navy)}
.dlg-h.green .d-ic{background:#c9efda;color:var(--green)}
.dlg-t{font-weight:800;font-size:17px}
.dlg-s{font-size:11.5px;opacity:.8}
.dlg-x{margin-inline-start:auto;background:none;border:0;color:inherit;padding:4px;opacity:.8}
.dlg-b{padding:16px 18px;overflow-y:auto;flex:1}
.dlg-f{padding:12px 18px;border-top:1px solid var(--line2);display:flex;gap:10px;align-items:center}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:12px;color:#59616f;margin-bottom:5px;font-weight:500}
.fld label .req{color:var(--red)}
.inp{width:100%;height:42px;border:1px solid #e9e7e4;border-radius:10px;background:#fbf9f8;padding:0 12px;font-size:13px;outline:0}
.inp:focus{border-color:var(--navy);background:#fff}
textarea.inp{height:80px;padding:10px 12px;resize:vertical}
.inp-ic{position:relative}
.inp-ic .mi{position:absolute;inset-inline-start:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:16px}
.inp-ic .inp{padding-inline-start:34px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.fbox{border:1px solid #f3f1ee;border-radius:12px;padding:12px;margin-bottom:12px;background:#fff}
.fbox-t{font-weight:800;font-size:12px;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.check{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 0;cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--navy)}
.sw{position:relative;width:38px;height:20px;border-radius:12px;background:#dcd9d5;border:0;flex:0 0 38px;transition:.2s;padding:0}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--navy)}
.sw.on::after{inset-inline-start:21px}
.pill-opt{height:32px;padding:0 14px;border-radius:16px;border:1px solid var(--line);background:#fff;font-size:12.5px}
.pill-opt.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.radio-card{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid #f3f1ee;border-radius:10px;margin-bottom:6px;cursor:pointer;font-size:13px}
.radio-card.on{background:#f9f5f0;border-color:var(--blue-b)}
.radio-card .rc-s{font-size:11px;color:var(--muted)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#323a46;color:#fff;padding:10px 18px;border-radius:10px;font-size:12px;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.menu{position:absolute;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.14);padding:6px;z-index:150;min-width:160px}
.menu button{display:flex;width:100%;gap:8px;align-items:center;background:none;border:0;padding:9px 10px;border-radius:7px;font-size:13px;text-align:start}
.menu button:hover{background:#f8f6f3}

/* stepper */
.stepper{display:flex;align-items:center;gap:0;margin:6px 0 18px}
.st{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
.st .bar{height:3px;background:#e9e7e4;width:100%;border-radius:2px}
.st.done .bar,.st.cur .bar{background:var(--navy)}
.st .dot{width:16px;height:16px;border-radius:50%;background:#e9e7e4;color:#8a93a1;font-size:9px;display:flex;align-items:center;justify-content:center}
.st.cur .dot{background:var(--blue);color:#fff}
.st.done .dot{background:var(--green);color:#fff}

/* calendar */
.calhead{background:linear-gradient(270deg,#654324,#56391f);border-radius:16px;color:#fff;padding:20px 24px;display:flex;align-items:center;gap:10px;box-shadow:0 6px 18px rgba(79, 53, 30,.25)}
.cal{background:#fff;border-radius:14px;box-shadow:var(--sh);margin-top:16px;overflow:hidden;border:1px solid #f2f0ed}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);background:#f9f8f6;font-size:12.5px;color:var(--navy);font-weight:700}
.cal-dow div{padding:10px 14px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-cell{height:110px;padding:10px;font-size:12.5px;font-weight:700;position:relative;border-top:1px solid #f4f2f1;cursor:pointer}
.cal-cell.out{color:#b8bec9}
.cal-cell.today{background:var(--navy);color:#fff;border-radius:6px;margin:4px}
.cal-cell.sel{background:#f4f2f1;border-radius:6px;margin:4px}
.ev{font-size:9.5px;color:#fff;border-radius:4px;padding:2px 5px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.fab{position:fixed;bottom:24px;left:24px;background:var(--navy);color:#fff;border:0;height:40px;border-radius:12px;padding:0 16px;font-weight:700;display:flex;align-items:center;gap:6px;box-shadow:0 6px 16px rgba(101, 67, 36,.35);z-index:6}
/* mini month (attendance) */
.mcal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.mcal .h{font-size:11.5px;color:var(--muted);text-align:center;padding:4px 0;overflow:hidden;white-space:nowrap}
.mcal .d{height:32px;border-radius:5px;background:#f6f4f3;font-size:11px;display:flex;align-items:center;justify-content:center;position:relative;color:#59616f}
.mcal .d.ab{background:#fde4e7;color:var(--red);border:1px solid #f7c1c8}
.mcal .d.we{background:#eeeae1}

.mp-count{margin-inline-start:auto;min-width:22px;height:20px;padding:0 6px;border-radius:10px;background:var(--navy);color:#fff;font-size:11.5px;display:inline-flex;align-items:center;justify-content:center}
.mp-btn{width:26px;height:26px;border:0;border-radius:7px;background:transparent;color:var(--muted,#6b6b6b);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.mp-btn:hover{background:#f3ebe3;color:var(--navy)}
.map-panel.min .mp-body{display:none}
.map-panel.min .mp-head{border-bottom:0}
.map-panel.min .mp-head .mp-btn:last-child .mi{transform:rotate(180deg)}
.mp-body{padding:8px 10px 10px;display:flex;flex-direction:column;gap:8px;min-height:0}
.mp-body .search{margin:0;height:34px;padding:0 10px}
.mp-filters{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.mp-chip{height:26px;padding:0 10px;border-radius:13px;border:1px solid var(--line);background:#fff;font:inherit;font-size:12px;cursor:pointer;color:inherit}
.mp-chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.mp-date{margin-inline-start:auto;display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 8px;border-radius:13px;border:1px solid var(--line);font-size:12px;color:var(--navy)}
.mp-date input{border:0;background:transparent;font:inherit;font-size:12px;width:104px;color:inherit}
.map-layers{position:absolute;top:12px;inset-inline-end:12px;z-index:1000;display:flex;gap:2px;padding:3px;background:rgba(255,255,255,.95);border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.map-layers button{width:30px;height:30px;border:0;border-radius:7px;background:transparent;cursor:pointer;color:#555;display:inline-flex;align-items:center;justify-content:center}
.map-layers button.on{background:var(--navy);color:#fff}
.map-list{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:4px;max-height:calc(100vh - 290px)}
@media (max-width:700px){.map-panel{top:auto;bottom:10px;inset-inline:10px;width:auto;max-height:46%}.map-list{max-height:none}}
.map-row{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 8px;cursor:pointer;text-align:start;font:inherit;color:inherit;width:100%}
.map-row:hover{background:#f7f0e9}
.btn.l.on{border-color:var(--navy);color:var(--navy);background:#f7f0e9}

/** copy to the clipboard; works on file:// and when the Clipboard API is refused */
function copyText(v){
  const fallback = () => { const t = document.createElement('textarea'); t.value = v; t.setAttribute('readonly', ''); t.style.cssText = 'position:fixed;opacity:0;top:0'; document.body.appendChild(t); t.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (e) {} t.remove(); toast(ok ? 'تم النسخ' : 'تعذّر النسخ'); };
  try { if (navigator.clipboard && window.isSecureContext) { navigator.clipboard.writeText(String(v)).then(() => toast('تم النسخ'), fallback); return; } } catch (e) {}
  fallback();
}
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), 2200); }

}

/* ===== table component ===== */
const TBL = {};
function table(id, cols, rows, opt={}){
  const st = TBL[id] || (TBL[id] = {sort:null, dir:1, filters:{}});
  let data = rows.slice();
  for (const [k,v] of Object.entries(st.filters)) if (v) { const c=cols.find(c=>c.k===k); data = data.filter(r => String(c.v ? c.v(r) : r[k]).toLowerCase().includes(v.toLowerCase())); }
  if (st.sort) { const c=cols.find(c=>c.k===st.sort); const g = r => (c.v ? c.v(r) : r[c.k]); data.sort((a,b)=>{ const x=g(a), y=g(b); return (typeof x==='number'&&typeof y==='number' ? x-y : String(x).localeCompare(String(y),'ar')) * st.dir; }); }
  const tools = opt.tools !== false;
  const th = cols.map(c => `<th style="${c.w?`width:${c.w}`:''}"><div class="th">${esc(c.label)}${tools && c.tools!==false ? `<span class="th-ic"><span class="mi ${st.filters[c.k]?'on':''}" title="تصفية" onclick="${A(ev=>filterMenu(ev, id, c))}">filter_list</span><span class="mi ${st.sort===c.k?'on':''}" title="ترتيب" onclick="${A(()=>{ if(st.sort===c.k) st.dir*=-1; else {st.sort=c.k; st.dir=1;} upd(opt.part||id+'-p'); })}">${st.sort===c.k?(st.dir>0?'arrow_upward':'arrow_downward'):'swap_vert'}</span></span>`:''}</div></th>`).join('');
  const body = data.length ? data.map(r => `<tr class="${opt.rowClass?opt.rowClass(r):''}">${cols.map(c=>`<td>${c.r ? c.r(r) : esc(c.v ? c.v(r) : r[c.k])}</td>`).join('')}</tr>`).join('')
    : `<tr><td colspan="${cols.length}">${opt.empty || `<div class="empty">${ic('inbox')}<div class="e-t">لا توجد بيانات</div></div>`}</td></tr>`;
  return `<div class="tbl-wrap"><table class="t ${opt.fixed?'fixed':''}" data-table="${id}"><thead><tr>${th}</tr></thead><tbody>${body}</tbody></table>${opt.pager?pager(data.length):''}</div>`;
}
function tbl(id, cols, rowsFn, opt={}){ return P(id+'-p', () => table(id, cols, rowsFn(), opt)); }
function pager(n){ return `<div class="pager"><span>${ic('expand_more','s16')} 20 &nbsp; Rows per page</span><span>1 - ${n} of ${n} &nbsp; Page 1 of 1</span><span><span class="mi s16" title="First Page">first_page</span> <span class="mi s16">chevron_left</span> <span class="pg">1</span> <span class="mi s16">chevron_right</span> <span class="mi s16">last_page</span></span></div>`; }
function filterMenu(ev, id, c){
  ev.stopPropagation(); document.querySelectorAll('.menu').forEach(m=>m.remove());
  const st = TBL[id]; const m = document.createElement('div'); m.className='menu';
  m.innerHTML = `<div style="padding:4px"><input class="inp" placeholder="${esc(tr('تصفية')+' '+tr(c.label))}" value="${esc(st.filters[c.k]||'')}"></div><button data-a>${ic('check','s16')} تطبيق</button><button data-c>${ic('close','s16')} مسح</button>`;
  const r = ev.target.getBoundingClientRect(); m.style.top = (r.bottom+4)+'px'; m.style.left = Math.max(8, r.left-140)+'px';
  document.body.appendChild(m); const i = m.querySelector('input'); i.focus();
  const apply = v => { st.filters[c.k]=v; m.remove(); upd(id+'-p'); };
  m.querySelector('[data-a]').onclick = () => apply(i.value.trim());
  m.querySelector('[data-c]').onclick = () => apply('');
  i.onkeydown = e => { if(e.key==='Enter') apply(i.value.trim()); };
}

function popMenu(ev, items){
  ev.stopPropagation(); document.querySelectorAll('.menu').forEach(m=>m.remove());

  m.innerHTML = items.map((it,i)=>`<button data-i="${i}">${it[1]?ic(it[1],'s16'):''} ${esc(it[0])}</button>`).join('');

  document.body.appendChild(m); m.querySelectorAll('button').forEach(b=>b.onclick=()=>{ m.remove(); items[b.dataset.i][2](); });
}

function monthGrid(y, m, opts={}){
  const first = new Date(y, m, 1), days = new Date(y, m+1, 0).getDate();
  const heads = opts.en ? ['S','M','T','W','T','F','S'] : ['ح','ن','ث','ر','خ','ج','س'];
  let h = heads.map(x=>`<div class="h">${x}</div>`).join('');
  for (let i=0;i<first.getDay();i++) h += '<div></div>';
  const t = today();
  for (let d=1; d<=days; d++){
    const dt = new Date(y,m,d), dow = dt.getDay(), past = dt <= t;
    const isT = dt.toDateString()===t.toDateString();
    const cls = isT ? 'td' : (dow===5||dow===6) ? 'we' : (past && opts.absent ? 'ab' : '');
    h += `<div class="d ${cls}">${d}${isT?'<span class="dot"></span>':''}</div>`;
  }
  return `<div class="mcal">${h}</div>`;
}

/* Partner change (Nov 2026): compact stat tiles that open their records, an «تنبيهات» card (meetings + document
   expiries), and no leave-requests / activity / tasks sections on the home page. Everything goes through
   allEmps()/inScope(), so a branch manager only sees his branch. */
const DOC_KINDS = [['civil','انتهاء البطاقة المدنية','badge'],['passport','انتهاء جواز السفر','flight'],['residence','انتهاء بطاقة الإقامة','home'],['permit','انتهاء تصريح العمل','work']];
const ALERT_DAYS = 60;
function dashData(){
  const brSel = isBranchMode() ? DB.viewer.branch : ui('dash.branch', 'all');
  const emps = activeEmps().filter(e => brSel==='all' || e.branches.includes(brSel));
  const ids = new Set(emps.map(e=>e.id));
  const att = todaysAttendance().filter(a => ids.has(a.emp));
  const t0 = todayIso();
  const onLeave = scoped(DB.leaves).filter(l => ids.has(l.emp) && l.status==='موافق عليه' && l.from <= t0 && l.to >= t0);
  const leaveIds = new Set(onLeave.map(l=>l.emp));
  const present = att.filter(a=>a.status!=='غائب'), absent = att.filter(a=>a.status==='غائب' && !leaveIds.has(a.emp));
  const pend = scoped(DB.leaves).filter(l=>l.status==='قيد الانتظار' && ids.has(l.emp));
  const projects = DB.projects.filter(p => p.members.some(id => inScope(id) && (brSel==='all' || ids.has(id))));
  const swaps = scoped(DB.swaps).filter(x => ids.has(x.emp));
  return { brSel, emps, att, present, absent, onLeave, pend, projects, swaps, alerts: dashAlerts(emps) };
}
/** upcoming meetings + document/contract expiries within ALERT_DAYS, nearest first */
function dashAlerts(emps){
  const ids = new Set(emps.map(e=>e.id)); const out = [];
  const t0 = todayIso();
  const add = (date, o) => { const d = daysBetween(t0, date.slice(0,10)); if (d >= 0 && d <= ALERT_DAYS) out.push(Object.assign({date, days:d}, o)); };
  DB.events.filter(ev => ev.type==='meeting' && (ev.attendees||[]).some(id => ids.has(id))).forEach(ev => add(ev.start, {kind:'meeting', icon:'event', title:ev.title, label:'اجتماع', time: ev.allDay ? '' : fmtTimeEn(ev.start), ev}));
  emps.forEach(e => {
    if (e.contract.end) add(e.contract.end, {kind:'contract', icon:'description', label:'انتهاء العقد', emp:e});
    DOC_KINDS.forEach(([k, l, i]) => { const d = (e.docExp||{})[k]; if (d) add(d, {kind:k, icon:i, label:l, emp:e}); });
  });
  return out.sort((a,b) => a.date.localeCompare(b.date));
}

      <div class="card dash-list"><div class="ds-t">${ic('hourglass_empty','s20')}<b>انتهاءات المستندات</b><span class="small muted" style="margin-inline-start:auto">خلال ${ALERT_DAYS} يومًا</span></div>${expiries.length ? expiries.map(alertRow).join('') : `<div class="small muted dl-empty">لا توجد انتهاءات قادمة</div>`}</div>

function donutSVG(rate){
  const r = 52, c = 2*Math.PI*r, on = c*Math.max(0,Math.min(100,rate))/100;
  return `<svg viewBox="0 0 140 140" width="170" height="170" aria-hidden="true"><circle cx="70" cy="70" r="${r}" fill="none" stroke="var(--tint-track)" stroke-width="16"/><circle cx="70" cy="70" r="${r}" fill="none" stroke="var(--navy)" stroke-width="16" stroke-linecap="${rate>0&&rate<100?'round':'butt'}" stroke-dasharray="${on} ${c}" transform="rotate(-90 70 70)"/></svg>`;
}
/** attendance % for the 7 days before today: deterministic seeded history (no per-day records exist in the demo) */
function attTrend(emps, scope, todayRate){
  const out = [];
  for (let k = 6; k >= 0; k--) {
    const dt = new Date(today().getFullYear(), today().getMonth(), today().getDate()-k), iso = fmtIso(dt);
    let h = 0; for (const ch of iso + '|' + scope + '|' + emps.length) h = (h*31 + ch.charCodeAt(0)) >>> 0;
    out.push({ iso, dow: dt.getDay(), pct: k === 0 ? todayRate : 72 + (h % 22) });
  }
  return out;
}
/* smooth area chart; like the partner's ref1 the time axis runs left → right (latest on the right) in every language */
function trendSVG(pts){
  const W = 760, H = 250, L = 50, R = 30, T = 30, B = 30;
  const lo = Math.min(60, Math.floor((Math.min(...pts.map(p=>p.pct)) - 5) / 10) * 10), span = 100 - lo;
  const x = i => L + i/(pts.length-1)*(W-L-R);
  const y = v => T + (100-Math.max(lo,Math.min(100,v)))/span*(H-T-B);
  const P = pts.map((p,i)=>[x(i), y(p.pct)]);
  let path = `M${P[0][0]},${P[0][1]}`;
  for (let i=0;i<P.length-1;i++){ const p0=P[i-1]||P[i], p1=P[i], p2=P[i+1], p3=P[i+2]||p2;
    path += ` C${p1[0]+(p2[0]-p0[0])/6},${p1[1]+(p2[1]-p0[1])/6} ${p2[0]-(p3[0]-p1[0])/6},${p2[1]-(p3[1]-p1[1])/6} ${p2[0]},${p2[1]}`; }
  const last = P[P.length-1], lastV = pts[pts.length-1].pct;
  const ticks = []; for (let v = 100; v >= lo; v -= 10) ticks.push(v);
  const grid = ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-dasharray="${v===lo?'':'3 4'}"/><text x="${L-8}" y="${y(v)+4}" font-size="11" fill="var(--muted)" text-anchor="end" direction="ltr">${v}%</text>`).join('');
  return `<svg class="trend" viewBox="0 0 ${W} ${H}" width="100%" direction="ltr" role="img" aria-label="اتجاه الحضور (آخر 7 أيام)"><defs><linearGradient id="trg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--navy);stop-opacity:.22"/><stop offset="1" style="stop-color:var(--navy);stop-opacity:0"/></linearGradient></defs>
    ${grid}
    <path d="${path} L${last[0]},${y(lo)} L${P[0][0]},${y(lo)} Z" fill="url(#trg)"/><path d="${path}" fill="none" stroke="var(--navy)" stroke-width="2.5" stroke-linecap="round"/>
    ${P.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${i===P.length-1?6:4}" fill="#fff" stroke="var(--navy)" stroke-width="2.5"/>`).join('')}
    <g data-trend-last><rect x="${last[0]-24}" y="${last[1]-33}" width="48" height="21" rx="6" fill="var(--navy)"/><text x="${last[0]}" y="${last[1]-18}" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" direction="ltr">${lastV}%</text></g>
    ${pts.map((p,i)=>`<text x="${x(i)}" y="${H-8}" font-size="12" fill="var(--muted)" text-anchor="middle" data-day="${p.iso}">${DOW_AR[p.dow]}</text>`).join('')}</svg>`;
}

/* Real satellite map of Oman (Leaflet + Esri World Imagery; keyless). Google Maps needs a paid API key — swap the tile URL when one exists. */
const OMAP = { lib:null, map:null, layers:null, cur:'satellite' };
function loadLeaflet(){
  if (OMAP.lib) return OMAP.lib;
  OMAP.lib = new Promise((res, rej) => {
    const css = document.createElement('link'); css.rel='stylesheet'; css.href='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css'; document.head.appendChild(css);
    const js = document.createElement('script'); js.src='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js'; js.onload=()=>res(window.L); js.onerror=rej; document.head.appendChild(js);
  });
  return OMAP.lib;
}
function setMapLayer(k){
  OMAP.cur = k; if (!OMAP.map) return;
  Object.values(OMAP.layers).forEach(l=>OMAP.map.removeLayer(l));
  (k==='satellite' ? [OMAP.layers.sat, OMAP.layers.labels] : [OMAP.layers[k]]).forEach(l=>l.addTo(OMAP.map));
}
PAGES.attendance_map.after = () => {
  const el = document.getElementById('omap'); if (!el) return;
  loadLeaflet().then(L => {
    if (!document.body.contains(el)) return;
    if (OMAP.map) { OMAP.map.remove(); OMAP.map = null; }
    const o = { maxZoom:19, keepBuffer:8 };
    OMAP.layers = {
      sat: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {...o, attribution:'Imagery © Esri, Maxar, Earthstar Geographics'}),
      labels: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {...o, pane:'overlayPane'}),
      map: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {...o, attribution:'© OpenStreetMap'}),
      terrain: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {...o, attribution:'© Esri'})
    };
    const map = OMAP.map = L.map(el, { zoomControl:false, zoomSnap:0.5, zoomDelta:0.5, wheelPxPerZoomLevel:120, preferCanvas:false, inertia:true, inertiaDeceleration:2500, fadeAnimation:true, zoomAnimation:true, worldCopyJump:false, minZoom:5,
      maxBounds:[[14.5,50.5],[28.5,62.5]], maxBoundsViscosity:0.8 });
    L.control.zoom({position:'bottomleft'}).addTo(map);
    setMapLayer(OMAP.cur);
    const brs = scopedBranches().filter(b=>Number(b.radius) < 1000);
    if (brs.length) map.fitBounds(L.latLngBounds(brs.map(b=>[Number(b.lat),Number(b.lng)])).pad(0.8), {maxZoom:13, animate:false}); else map.fitBounds([[16.6,51.9],[26.4,59.9]], {animate:false});
    brs.forEach(b => {
      const ll = [Number(b.lat), Number(b.lng)];
      L.circle(ll, { radius:Number(b.radius)*1000, color:'#f6c343', weight:2, fillOpacity:.15 }).addTo(map);
      L.circleMarker(ll, { radius:8, color:'#fff', weight:3, fillColor:'#c0392b', fillOpacity:1 }).addTo(map).bindTooltip(esc(b.name), {direction:'top'});
    });
    L.control.scale({position:'bottomleft', imperial:false}).addTo(map);
    const omanBtn = L.control({position:'bottomleft'}); omanBtn.onAdd = () => { const b = L.DomUtil.create('button','leaflet-bar'); b.textContent = 'عُمان'; b.style.cssText='background:#fff;padding:4px 10px;cursor:pointer;font:inherit'; L.DomEvent.on(b,'click',e=>{ L.DomEvent.stop(e); map.flyToBounds([[16.6,51.9],[26.4,59.9]],{duration:1.2}); }); return b; }; omanBtn.addTo(map);
  }).catch(()=>{ el.innerHTML = '<div class="small" style="color:#fff;padding:140px 20px;text-align:center">تعذّر تحميل الخريطة — تحقق من الاتصال بالإنترنت</div>'; });
};

function ensureSwaps(){
  if (DB.swaps.length || DB._swSeeded) return; DB._swSeeded = true;
  DB.swaps.push({id:'sw1',emp:'e3',with:'e5',date:relDay(2),from:'صباحي',to:'مسائي',reason:'موعد في المستشفى',status:'قيد الانتظار'},
    {id:'sw2',emp:'e6',with:'e2',date:relDay(4),from:'مسائي',to:'صباحي',reason:'ظرف عائلي',status:'قيد الانتظار'},
    {id:'sw3',emp:'e5',with:'e3',date:relDay(-3),from:'صباحي',to:'مسائي',reason:'دراسة',status:'موافق عليه'},
    {id:'sw4',emp:'e2',with:'e6',date:relDay(-6),from:'صباحي',to:'مسائي',reason:'سفر',status:'مرفوض'},
    {id:'sw5',emp:'e4',with:'e7',date:relDay(-20),from:'مسائي',to:'صباحي',reason:'مراجعة',status:'منتهي'});
  save();
}
function swapList(){
  ensureSwaps();
  const t = ui('sw.t','الكل');
  const rows = scoped(DB.swaps).filter(x => (t==='الكل' || x.status===t) && (!UI['sw.d'] || x.date===UI['sw.d']) && match('sw.q', empName(x.emp), empName(x.with), x.reason));
  if (!rows.length) return empty('swap_horiz','لم يتم العثور على طلبات تبديل');
  return rows.map(x => `<div class="card p mt" style="box-shadow:none"><div class="row" style="gap:10px;flex-wrap:wrap">${av(emp(x.emp))}<div class="grow"><b>${esc(empName(x.emp))}</b> <span class="small muted">↔ ${esc(empName(x.with))}</span><div class="small muted">${esc(x.date)} · <span>${esc(x.from)}</span> ← <span>${esc(x.to)}</span> · <span>${esc(x.reason)}</span></div></div>${chip(x.status)}${x.status==='قيد الانتظار' ? `<button class="btn sm" onclick="${A(()=>{x.status='موافق عليه'; save(); upd('sw-l'); toast('تم قبول الطلب');})}">قبول</button><button class="btn sm g" onclick="${A(()=>{x.status='مرفوض'; save(); upd('sw-l'); toast('تم رفض الطلب');})}">رفض</button>` : ''}</div></div>`).join('');

/* daily verifications: «يوم واحد» = today, «فترة» = the last 30 days */
const dvFrom = () => { const d = today(); if (UI['dv.r']==='range') d.setDate(d.getDate()-30); return d; };
const dvRows = () => { const from = fmtIso(dvFrom()), to = todayIso(); return DB.verifications.filter(v => v.emps.some(inScope) && fmtIso(v.created) >= from && fmtIso(v.created) <= to); };
function createVerification(){

function editContract(e){
  const c = e.contract; const allow = c.allowances.map(a=>Object.assign({},a)); const benefits = c.benefits.slice();
  const radio = (name, opts, v) => `<div class="row" style="gap:30px">${opts.map(o=>`<label class="check"><input type="radio" name="${name}" value="${o}" ${o===v?'checked':''}>${o}</label>`).join('')}</div>`;
  const total = () => c.basic + allow.reduce((s,a)=>s+Number(a.amount||0),0);
  const d = dialog({title:'تعديل بيانات الموظف', width:'w7', body:() => `<div class="info">${ic('person','s16')}<b class="small">${esc(e.name)}</b><span class="small muted">(${esc(e.email)})</span></div>

      <div class="fbox"><b class="small">حالة المواطنة</b><div class="mt">${radio('nat',['عماني','غير عماني'],e.nationality)}</div></div>
      <div class="fbox"><b class="small">الجنس</b><div class="mt">${radio('gender',['ذكر','أنثى'],e.gender==='male'?'ذكر':'أنثى')}</div></div>
      ${fld('تاريخ الميلاد', `<input class="inp" type="date" name="dob" value="${e.dob}">`)}
      <div class="fbox"><b class="small">مولود خارج سلطنة عمان</b><div class="mt">${radio('born',['نعم','لا'],'لا')}</div></div>
      ${fld('رقم صاحب العمل', inp('empno','', e.employerNo||''))}
      <div class="sec-t">المستندات الحكومية</div>
      <div class="fbox"><div class="fbox-t">الإقامة</div><div class="fgrid">${fld('رقم الهوية/الإقامة',inp('idno','',(e.docsData||{}).idno||''))}${fld('تاريخ الإصدار','<input class="inp" type="date">')}${fld('تاريخ الانتهاء','<input class="inp" type="date">')}</div></div>
      <div class="fbox"><div class="fbox-t">التأمين الصحي</div><div class="fgrid">${fld('رقم البوليصة',inp('pol','',(e.docsData||{}).pol||''))}${fld('تاريخ الانتهاء','<input class="inp" type="date">')}</div></div>
      <div class="fbox"><div class="fbox-t">جواز السفر</div><div class="fgrid">${fld('الرقم',inp('pp','',(e.docsData||{}).pp||''))}${fld('تاريخ الانتهاء','<input class="inp" type="date">')}</div></div></div>
    <div data-pane="العقد" style="${ui('ctr.tab')==='العقد'?'':'display:none'}">
      <div class="sec-t mt">معلومات العقد</div><div class="fgrid">${fld('رقم العقد',inp('cno','',c.no))}${fld('نوع العقد',sel('ctype',['دوام كامل','دوام جزئي','مؤقت'],c.type))}</div>
      <div class="sec-t">الراتب والعلاوات</div><div class="fgrid">${fld('الراتب الأساسي',inp('basic','',c.basic,'number'))}${fld('نسبة خصم التأمينات',inp('spe','',c.spEmp,'number'))}${fld('نسبة خصم التأمينات للشركة',inp('spc','',c.spCo,'number'))}${fld('قيمة الشرط الجزائي',inp('pen','',c.penalty,'number'))}</div>
      <div class="row"><b class="small">${ic('payment','s16')} العلاوات</b><button class="btn sm o" style="margin-inline-start:auto" data-add-allow>${ic('add','s14')} إضافة علاوة</button></div>
      <div data-allow>${allow.map((a,i)=>`<div class="info"><button class="ibtn red" data-del-allow="${i}">${ic('delete')}</button><span class="grow small">${esc(a.name)}</span><b class="small">${a.amount} ريال عماني (${esc(a.period)})</b></div>`).join('')||'<div class="small muted">لا توجد علاوات</div>'}</div>
      <div class="info" style="background:var(--blue-l)"><b class="grow small">إجمالي الراتب الشهري</b><b style="color:var(--navy)" data-total>${total()} ريال عماني</b></div>
      <div class="sec-t mt">تواريخ العقد</div><div class="fgrid">${fld('تاريخ بدء العقد',`<input class="inp" type="date" name="start" value="${c.start}">`)}${fld('تاريخ انتهاء العقد',`<input class="inp" type="date" name="end" value="${c.end}">`)}</div>
      <div class="info"><span class="grow small">عقد غير محدد المدة</span>${sw('indef',c.indef)}</div>
      <div class="fgrid">${fld('فترة التجربة',inp('prob','',c.probation))}${fld('تاريخ انتهاء فترة التجربة',`<input class="inp" type="date" name="probEnd" value="${c.probEnd}">`)}</div>
      <div class="sec-t">تفاصيل العمل</div><div class="fgrid">${fld('موقع العمل',inp('place','',c.place))}${fld('ساعات العمل',inp('hours','',c.hours,'number'))}${fld('أيام العمل/الأسبوع',inp('dw','',c.daysWeek,'number'))}${fld('فترة الإشعار',inp('notice','',c.notice,'number'))}</div>

      <div class="sec-t">تفاصيل الدفع</div>${fld('طريقة الدفع',sel('pm',['تحويل بنكي','نقدي','شيك'],c.payMethod))}<div class="fgrid">${fld('اسم البنك',inp('bank','',c.bank))}${fld('رقم الحساب',inp('acct','',c.acct))}</div>${fld('الآيبان',inp('iban','',c.iban))}
      <div class="row"><b class="small">${ic('card_giftcard','s16')} المزايا الإضافية</b><button class="btn sm o" style="margin-inline-start:auto" data-add-ben>${ic('add','s14')} إضافة ميزة</button></div><div data-ben class="small muted mb">${benefits.length?benefits.map(esc).join('، '):'لم تتم إضافة مزايا إضافية بعد'}</div>
      ${fld('ملاحظات العقد',ta('cnotes','',c.notes))}<div class="info"><span class="grow small">عقد ساري</span>${sw('cact',c.active)}</div></div>`,
    foot:`<button class="btn" style="flex:1;justify-content:center" data-save>تحديث</button>${cancelBtn()}`});
  const box = d;
  box.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{ UI['ctr.tab']=b.dataset.t; box.querySelectorAll('[data-t]').forEach(x=>x.classList.toggle('on',x===b)); box.querySelectorAll('[data-pane]').forEach(p=>p.style.display=p.dataset.pane===b.dataset.t?'':'none'); });
  const redrawAllow = () => { box.querySelector('[data-allow]').innerHTML = allow.map((a,i)=>`<div class="info"><button class="ibtn red" data-del-allow="${i}">${ic('delete')}</button><span class="grow small">${esc(a.name)}</span><b class="small">${a.amount} ريال عماني (${esc(a.period)})</b></div>`).join('')||'<div class="small muted">لا توجد علاوات</div>'; box.querySelector('[data-total]').textContent = `${Number(box.querySelector('[name=basic]').value||0)+allow.reduce((s,a)=>s+Number(a.amount||0),0)} ريال عماني`; box.querySelectorAll('[data-del-allow]').forEach(b=>b.onclick=()=>{allow.splice(+b.dataset.delAllow,1); redrawAllow();}); };
  redrawAllow(); box.querySelector('[name=basic]').oninput = redrawAllow;
  box.querySelector('[data-add-allow]').onclick = () => { const sub = dialog({title:'إضافة علاوة', body:`${fld('',sel('at',['علاوة نقل','علاوة سكن','علاوة هاتف','أخرى'],'','نوع العلاوة'))}${fld('',inp('an','اسم العلاوة'))}${fld('',inp('aa','المبلغ','','number'))}${fld('',sel('ap',['شهري','سنوي','مرة واحدة'],'شهري','الفترة'))}${fld('',ta('ano','ملاحظات'))}`, foot:`<button class="btn" data-ok>إضافة</button>${cancelBtn()}`});
    sub.querySelector('[data-ok]').onclick = () => { const amount=Number(val('[name=aa]')); if(!amount){toast('أدخل المبلغ');return;} allow.push({name: val('[name=an]')||val('[name=at]')||'علاوة', amount, period: val('[name=ap]')||'شهري'}); sub.close(); redrawAllow(); }; };
  box.querySelector('[data-add-ben]').onclick = () => { const sub = dialog({title:'إضافة ميزة', body:inp('bn','الميزة'), foot:`<button class="btn" data-ok>إضافة</button>${cancelBtn()}`}); sub.querySelector('[data-ok]').onclick=()=>{ const v=val('[name=bn]'); if(v){benefits.push(v);} sub.close(); box.querySelector('[data-ben]').textContent = benefits.join('، ')||'لم تتم إضافة مزايا إضافية بعد'; }; };

function termCalc(w){
  const e = emp(w.emp); const c = e.contract;
  const basic = c.basic, daily = basic/30;
  const allowM = c.allowances.filter(a=>a.period==='شهري').reduce((s,a)=>s+Number(a.amount),0), allowD = allowM/30;
  const years = Math.max(0, daysBetween(c.start, w.date)/365);
  const omani = e.nationality==='عماني';
  const gratuity = omani ? 0 : basic * years;
  const usedAnnual = DB.leaves.filter(l=>l.emp===e.id && l.type==='lt11' && l.status==='موافق عليه').reduce((s,l)=>s+l.days,0);
  if (w.leaveDays==null) w.leaveDays = 30 - usedAnnual;
  const leave = (daily + allowD) * Number(w.leaveDays||0);
  const deductions = w.deductions.reduce((s,d)=>s+Number(d.amount||0),0);
  const net = gratuity + leave - Number(w.advances||0) - deductions;
  return {basic, daily, allowM, allowD, years, omani, gratuity, leave, deductions, net, usedAnnual};
}

    const nextOk = step!==1 || !!w.emp;
    d.querySelector('[data-wf]').innerHTML = `${step===6?`<button class="btn" data-create>إنشاء الإنهاء</button>`:`<button class="btn" data-next ${nextOk?'':'disabled'}>التالي</button>`}<span style="flex:1"></span>${step>1?`<button class="lnk" data-prev>السابق</button>`:''}`;
    const q = s => d.querySelector(s);
    d.querySelectorAll('[data-pick]').forEach(x=>x.onclick=()=>{ w.emp=x.dataset.pick; w.leaveDays=null; draw(); });
    q('[name=tq]') && (q('[name=tq]').oninput = ev => d.querySelectorAll('[data-pick]').forEach(x=>x.style.display = x.textContent.toLowerCase().includes(ev.target.value.toLowerCase())?'':'none'));
    d.querySelectorAll('[name=rsn]').forEach(x=>x.onchange=()=>{ w.reason=+x.value; draw(); });
    const keep = () => { if(q('[name=tdate]')){ w.date=q('[name=tdate]').value; w.lastDay=q('[name=tlast]').value; w.notice=q('[name=tnot]').value; } if(q('[name=adv]')) w.advances=Number(q('[name=adv]').value||0); if(q('[name=ldays]')) w.leaveDays=Number(q('[name=ldays]').value); if(q('[name=tnotes]')) w.notes=q('[name=tnotes]').value; };
    q('[name=tdate]') && (q('[name=tdate]').onchange = ev => { w.date = ev.target.value; const nd=D(w.date); nd.setDate(nd.getDate()-30); w.notice=fmtIso(nd); q('[name=tnot]').value=w.notice; });
    q('[name=ldays]') && (q('[name=ldays]').oninput = () => { keep(); q('[data-leave]').textContent = termCalc(w).leave.toFixed(3)+' ر.ع'; });
    q('[data-next]') && (q('[data-next]').onclick = () => { keep(); w.step++; draw(); });
    q('[data-prev]') && (q('[data-prev]').onclick = () => { keep(); w.step--; draw(); });
    q('[data-add-ded]') && (q('[data-add-ded]').onclick = () => { const s = dialog({title:'إضافة خصم', body:`${fld('الوصف',inp('dl','مثال: تسوية قرض'))}${fld('المبلغ',inp('da','0','','number'))}`, foot:`<button class="btn" data-ok>إضافة</button>${cancelBtn()}`}); s.querySelector('[data-ok]').onclick=()=>{ w.deductions.push({label:val('[name=dl]')||'خصم', amount:Number(val('[name=da]')||0)}); s.close(); draw(); }; });
    d.querySelectorAll('[data-del-ded]').forEach(x=>x.onclick=()=>{ w.deductions.splice(+x.dataset.delDed,1); draw(); });
    q('[data-create]') && (q('[data-create]').onclick = () => { keep(); const c2 = termCalc(w); DB.terminations.push({id:uid('t'), emp:w.emp, reason:r[0], article:r[1], date:w.date, lastDay:w.lastDay, notice:w.notice, gratuity:c2.gratuity, leave:c2.leave, advances:Number(w.advances||0), deductions:c2.deductions, net:c2.net, notes:w.notes, status:'قيد الانتظار'}); save(); d.close(); render(); toast('تم إنشاء الإنهاء'); });
  };
  draw();
  return w;
}

/* ---------- private chat (text, images, files). Attachments stay in this browser (IndexedDB), never uploaded. ---------- */
const CHAT_MAX = 10 * 1024 * 1024;
const CHAT_OK_EXT = ['jpg','jpeg','png','gif','webp','bmp','pdf','doc','docx','xls','xlsx','ppt','pptx','txt','csv'];
const CHAT_ACCEPT = 'image/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.csv';
const fmtSize = n => n < 1024 ? `${n} B` : n < 1048576 ? `${(n/1024).toFixed(1)} KB` : `${(n/1048576).toFixed(1)} MB`;
const FILES = { mem:{}, urls:{}, db:null,
  open(){ if (this.db) return this.db; this.db = new Promise((res) => { try { const r = indexedDB.open('corehr-files', 1); r.onupgradeneeded = () => r.result.createObjectStore('f'); r.onsuccess = () => res(r.result); r.onerror = () => res(null); } catch (e) { res(null); } }); return this.db; },
  async put(id, blob){ this.mem[id] = blob; const db = await this.open(); if (!db) return; try { db.transaction('f','readwrite').objectStore('f').put(blob, id); } catch (e) {} },
  async get(id){ if (this.mem[id]) return this.mem[id]; const db = await this.open(); if (!db) return null; return new Promise(res => { try { const q = db.transaction('f').objectStore('f').get(id); q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); } catch (e) { res(null); } }); },
  async url(id){ if (this.urls[id]) return this.urls[id]; const b = await this.get(id); return b ? (this.urls[id] = URL.createObjectURL(b)) : null; },
  del(id){ delete this.mem[id]; this.open().then(db => { try { db && db.transaction('f','readwrite').objectStore('f').delete(id); } catch (e) {} }); },
};
function chatFileCheck(f){
  const ext = (f.name.split('.').pop() || '').toLowerCase();
  if (/^video\//.test(f.type) || ['mp4','mov','avi','mkv','webm','m4v','3gp','wmv'].includes(ext)) return 'لا يمكن رفع ملفات الفيديو';
  if (!CHAT_OK_EXT.includes(ext)) return 'نوع الملف غير مسموح';
  if (f.size > CHAT_MAX) return 'حجم الملف أكبر من 10 ميجابايت';
  return '';
}
const CHAT_PENDING = {};
function chatBox(owner, members, part){
  owner.chat = owner.chat || [];
  if (!canChat(members)) return `<div class="chat-lock" data-chat-locked>${ic('lock','s28')}<b>محادثة خاصة</b><div class="small muted">هذه المحادثة متاحة لأعضاء المهمة ومدير الشركة فقط</div></div>`;
  const key = owner.id; const pend = CHAT_PENDING[key] || (CHAT_PENDING[key] = []);
  const mine = me().id;
  const fileChip = f => f.type && f.type.startsWith('image/')
    ? `<button class="chat-img" data-fid="${f.id}" title="${esc(f.name)}" onclick="${A(()=>chatOpenFile(f))}"><img alt="" data-thumb="${f.id}"><span class="ltr">${esc(f.name)} · ${fmtSize(f.size)}</span></button>`
    : `<button class="chat-file" data-fid="${f.id}" onclick="${A(()=>chatOpenFile(f))}">${ic(/pdf$/i.test(f.name)?'picture_as_pdf':'insert_drive_file','s16')}<span class="grow ltr" style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(f.name)}</span><span class="small muted ltr">${fmtSize(f.size)}</span></button>`;
  const msgs = owner.chat.map(m => { const me_ = m.by === mine; const e = emp(m.by);
    return `<div class="cmsg ${me_?'me':''}" data-msg="${m.id}">${me_?'':`<span class="mini-av" style="background:${avColor(m.by)};width:24px;height:24px">${esc(initials(tr(e?e.name:'?')))}</span>`}<div class="cb"><div class="cb-h"><b>${esc(e?e.name:'N/A')}</b><span class="ltr">${fmtTimeEn(m.at)} · ${fmtEn(m.at)}</span></div>${m.text?`<div class="cb-t" data-noi18n>${esc(m.text)}</div>`:''}${(m.files||[]).map(fileChip).join('')}</div></div>`; }).join('');
  setTimeout(() => { document.querySelectorAll('img[data-thumb]').forEach(async im => { if (im.src) return; const u = await FILES.url(im.dataset.thumb); if (u) im.src = u; else im.closest('.chat-img').classList.add('missing'); }); const b = document.querySelector('[data-chat-msgs]'); b && (b.scrollTop = b.scrollHeight); }, 0);
  return `<div class="chat" data-chatbox="${key}"><div class="chat-msgs" data-chat-msgs>${msgs || empty('chat_bubble_outline','لا توجد رسائل بعد','ابدأ المحادثة')}</div>
    ${pend.length?`<div class="chat-pend">${pend.map((f,i)=>`<span class="chip c-blue" data-pending>${ic(f.type.startsWith('image/')?'image':'attach_file')} <span class="ltr">${esc(f.name)} · ${fmtSize(f.size)}</span> <span class="mi s14" style="cursor:pointer" title="إزالة" onclick="${A(()=>{ pend.splice(i,1); upd(part); })}">close</span></span>`).join('')}</div>`:''}
    <div class="chat-in"><label class="ibtn" title="إرفاق صورة أو ملف">${ic('attach_file')}<input type="file" hidden multiple accept="${CHAT_ACCEPT}" data-chat-file onchange="${A(ev=>{ for (const f of ev.target.files) { const err = chatFileCheck(f); if (err) { toast(err + ' — «' + f.name + '»'); continue; } pend.push(f); } ev.target.value=''; upd(part); })}"></label>
      <input class="inp" data-chat-text placeholder="اكتب رسالة..." onkeydown="if(event.key==='Enter'){event.preventDefault(); this.parentNode.querySelector('[data-chat-send]').click();}">
      <button class="tb-btn" style="background:var(--navy)" title="إرسال" data-chat-send onclick="${A(async ev=>{ const box = ev.target.closest('.chat'); const text = box.querySelector('[data-chat-text]').value.trim(); if (!text && !pend.length) { box.querySelector('[data-chat-text]').focus(); return; }
        const files = []; for (const f of pend.splice(0)) { const id = uid('f'); await FILES.put(id, f); files.push({id, name:f.name, size:f.size, type:f.type || ''}); }
        owner.chat.push({ id:uid('m'), by:mine, at:new Date().toISOString(), text, files }); save(); upd(part); })}">${ic('send','s16')}</button></div>
    <div class="small muted" style="margin-top:6px">${ic('lock','s14')} <span>خاصة بالأعضاء · صور وملفات PDF وأوفيس حتى 10 ميجابايت</span></div></div>`;
}
async function chatOpenFile(f){
  const u = await FILES.url(f.id); if (!u) { toast('الملف غير متوفر على هذا الجهاز'); return; }
  if (f.type.startsWith('image/')) { dialog({title:f.name, icon:'image', width:'w7', body:`<img src="${u}" alt="" style="max-width:100%;display:block;margin:auto;border-radius:8px">`, foot:`<a class="btn sm" href="${u}" download="${esc(f.name)}">${ic('get_app','s14')} تحميل</a>${cancelBtn('إغلاق')}`}); return; }
  const a = document.createElement('a'); a.href = u; a.download = f.name; document.body.appendChild(a); a.click(); a.remove();
}

/* ===================== رصيد الإجازات ===================== */
function balanceOf(e){
  const used = DB.leaves.filter(l=>l.emp===e.id && l.type==='lt11' && l.status==='موافق عليه').reduce((s,l)=>s+l.days,0);
  const months = daysBetween(e.contract.start, today())/30.4;
  const current = months < 6 ? 0 : Math.min(30, Math.floor(months)*2.5);
  const annual = 30, old = e.contract.oldBalance||0, total = annual + old, before = e.contract.usedBefore||0;
  return {annual, current, old, total, before, used, remaining: total - used - before};
}

  ];
  return `<div class="page">${phead({icon:'account_balance_wallet', title:'رصيد الإجازات', actions:`${exportBtn('تصدير إلى إكسل', ()=>downloadCSV('leave_balance.csv',cols.slice(0,9).map(c=>c.label), list().map(e=>{const b=balanceOf(e); return [e.name,b.annual,b.current,b.old,b.total,b.before,b.used,b.remaining,e.contract.start];})))}<button class="btn" onclick="${A(()=>{render();toast('تم التحديث');})}">${ic('refresh','s16')} تحديث</button>`, below:searchBox('ابحث عن الموظفين...','vb.q','vb-p')})}

function serviceDialog(s){

  const draw = () => d.querySelector('[data-fields]').innerHTML = fields.map((f,i)=>`<div class="info mt"><input class="inp" data-fl="${i}" value="${esc(f.label)}" placeholder="اسم الحقل"><select class="inp" style="width:120px" data-ft="${i}">${['نص','رقم','تاريخ','ملف'].map(t=>`<option ${t===f.type?'selected':''}>${t}</option>`).join('')}</select><button class="ibtn red" data-df="${i}">${ic('delete')}</button></div>`).join('') || '<div class="small muted mt">لا توجد حقول</div>';
  const sync = () => fields.forEach((f,i)=>{ f.label=d.querySelector(`[data-fl="${i}"]`).value; f.type=d.querySelector(`[data-ft="${i}"]`).value; });
  draw();
  d.querySelector('[data-addf]').onclick = () => { sync(); fields.push({label:'',type:'نص'}); draw(); };
  d.querySelector('[data-fields]').onclick = ev => { const b = ev.target.closest('[data-df]'); if(b){ sync(); fields.splice(+b.dataset.df,1); draw(); } };
  d.querySelector('[data-save]').onclick = () => { sync(); const ar=val('[name=sa]'), en=val('[name=se]'); if(!ar||!en){toast('العنوان بالعربية والإنجليزية مطلوب');return;} if(s) Object.assign(s,{ar,en,notify:swVal('notify'),fields}); else DB.services.push({id:uid('s'),ar,en,at:new Date().toISOString().slice(0,16),notify:swVal('notify'),fields}); save(); d.close(); render(); toast('تم الحفظ'); };
}

/* branch location picker: click the map (Leaflet) to set the coordinates; offline, type them */
function branchMapPicker(b, done){
  const d = dialog({title:'محدد الخريطة', sub:esc(b.name), icon:'map', head:'blue', width:'w6', body:`<div data-pick-map style="height:260px;border-radius:10px;background:#1b2a1f;display:flex;align-items:center;justify-content:center;color:#fff" class="small">تحميل الخريطة…</div>
    <div class="fgrid mt">${fld('Lat',`<input class="inp ltr" data-plat value="${esc(b.lat)}">`)}${fld('Lng',`<input class="inp ltr" data-plng value="${esc(b.lng)}">`)}</div>`,
    foot:`<button class="btn" data-ok>حفظ</button>${cancelBtn()}`});
  const lat = d.querySelector('[data-plat]'), lng = d.querySelector('[data-plng]'); lat.focus();
  loadLeaflet().then(L => { const el = d.querySelector('[data-pick-map]'); if (!el) return; el.textContent = '';
    const map = L.map(el, { zoomControl:true }).setView([Number(b.lat)||23.588, Number(b.lng)||58.383], 13);
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom:19, attribution:'© Esri' }).addTo(map);
    const mk = L.marker([Number(b.lat)||23.588, Number(b.lng)||58.383]).addTo(map);
    map.on('click', e => { mk.setLatLng(e.latlng); lat.value = e.latlng.lat.toFixed(4); lng.value = e.latlng.lng.toFixed(4); });
  }).catch(() => { const el = d.querySelector('[data-pick-map]'); if (el) el.textContent = 'تعذّر تحميل الخريطة — أدخل الإحداثيات يدويًا'; });
  d.querySelector('[data-ok]').onclick = () => { const a = Number(lat.value), o = Number(lng.value); if (!isFinite(a) || !isFinite(o) || Math.abs(a) > 90 || Math.abs(o) > 180) { toast('إحداثيات غير صحيحة'); return; } b.lat = a.toFixed(4); b.lng = o.toFixed(4); d.close(); done(); toast('تم تحديد الموقع'); };
}

007","module":"termination","title_ar":"الإنهاء لضعف الأداء","rule_ar":"بعد إخطار العامل بأوجه عدم الكفاءة ومنحه مهلة لا تقل عن 6 أشهر؛ وإذا كان عمانيًا يشترط تعيين عماني بديل؛ وإخطار الوزارة قبل 3 أشهر من الإنهاء.","article":"43(3)","source":"LL","params":{"pip_min_months":6,"ministry_notice_months":3},"certainty":"explicit"},{"id":"TR-008","module":"termination","title_ar":"التقليص للسبب الاقتصادي","rule_ar":"يتطلب موافقة اللجنة المختصة، ومعيارًا عادلًا للاختيار، وإخطارًا لا يقل عن 3 أشهر، وأولوية إعادة التعيين. السبب الاقتصادي = خسارة مالية سنتين متتاليتين.","article":"1(22), 44, 45, 46","source":"LL","params":{"notice_months":3,"loss_years":2},"certainty":"explicit"},{"id":"TR-009","module":"termination","title_ar":"الفصل التعسفي","rule_ar":"يحكم بالإعادة أو بتعويض لا يقل عن أجر 3 أشهر ولا يزيد على 12 شهرًا بآخر أجر شامل، إضافة إلى المكافأة وأجر الإخطار والاشتراكات.","article":"11, 12","source":"LL","params":{"min_months":3,"max_months":12},"certainty":"explicit"},{"id":"TR-010","module":"termination","title_ar":"مكافأة نهاية الخدمة","rule_ar":"للعمال غير المنتفعين بقانون الحماية الاجتماعية: لا تقل عن أجر أساسي شهر عن كل سنة خدمة، وكسور السنة بالنسبة، على أساس آخر أجر أساسي. تسري إلى حين العمل بنظام الادخار.","article":"61, 80, 83","source":"LL","params":{"months_per_year":1,"base":"last_basic","valid_until":"2027-07-19","excluded_leave_codes":["unpaid","childcare_unpaid"]},"certainty":"explicit","requires_verification":true,"note":"سارية حتى بدء نظام الادخار للوافدين في 19 يوليو 2027 (مؤجل) — برمجها بتاريخ سريان ينهي القاعدة تلقائيًا. تاريخ 19 يوليو 2027 من مصادر ثانوية — يُؤكد من نص المرسوم المعدّل لقانون الحماية الاجتماعية."},{"id":"TR-011","module":"termination","title_ar":"موعد صرف المستحقات","rule_ar":"فورًا عند انتهاء العلاقة، أو خلال 7 أيام إذا ترك العامل العمل من تلقاء نفسه.","article":"91","source":"LL","params":{"resignation_days":7},"certainty":"explicit","note":"تفسير: «ترك العمل من تلقاء نفسه» يُطبّق على الانقطاع/الترك؛ الاستقالة بإخطار تُصرف مستحقاتها في آخر يوم (أحوط لصاحب العمل)."},{"id":"TR-012","module":"termination","title_ar":"شهادة نهاية الخدمة","rule_ar":"يلتزم صاحب العمل بتسليم العامل بناء على طلبه ومجانًا شهادة نهاية خدمة، ورد أوراقه وشهاداته.","article":"62","source":"LL","params":{},"certainty":"explicit"},{"id":"TR-013","module":"termination","title_ar":"إعادة العامل غير العماني","rule_ar":"يلتزم صاحب العمل بإعادة العامل غير العماني إلى بلده خلال 60 يومًا من انتهاء العقد، ومنحه براءة ذمة عند الطلب.","article":"14","source":"LL","params":{"days":60},"certainty":"explicit"},{"id":"TR-014","module":"termination","title_ar":"سقوط المطالبات","rule_ar":"يسقط الحق في المطالبة بأي حق بعد سنة من تاريخ استحقاقه.","article":"9","source":"LL","params":{"years":1},"certainty":"explicit"},{"id":"PY-001","module":"payroll","title_ar":"الدفع عبر نظام حماية الأجور","rule_ar":"لا تبرأ ذمة صاحب العمل إلا بتحويل الأجر لحساب العامل في مصرف أو مؤسسة مالية مرخصة، عبر نظام حماية الأجور، خلال 3 أيام من نهاية مدة الاستحقاق.","article":"LL 87, 90; MD729 art 3","source":"LL + MD729_2024","params":{"max_days_after_period":3},"certainty":"explicit"},{"id":"PY-002","module":"payroll","title_ar":"استثناءات حماية الأجور","rule_ar":"يستثنى من التحويل عبر النظام: نزاع عمالي أوقف العامل أكثر من 30 يومًا، توقيف لسبب لا يعود لصاحب العمل أكثر من 30 يومًا، بلاغ ترك عمل مضى عليه أكثر من 30 يومًا، عامل جديد لم يكمل 30 يومًا، عامل في إجازة بدون أجر.","article":"5","source":"MD729_2024","params":{"threshold_days":30},"certainty":"explicit"},{"id":"PY-003","module":"payroll","title_ar":"تكرار الدفع","rule_ar":"العمال بأجر شهري تؤدى أجورهم مرة على الأقل كل شهر.","article":"90","source":"LL","params":{},"certainty":"explicit"},{"id":"PY-004","module":"payroll","title_ar":"الحد الأدنى لأجور العمانيين","rule_ar":"325 ر.ع شهريًا (225 أجر أساسي + 100 بدلات) للعمانيين في القطاع الخاص.","article":"-","source":"MD222_2013","params":{"min_basic":225,"min_allowances":100,"min_gross":325,"currency":"OMR"},"certainty":"explicit","requires_verification"
