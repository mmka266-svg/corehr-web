  const rows = visible().filter(e => e.contract.end && e.contract.end >= t && e.contract.end <= until).map(e => [e.name, 'عقد العمل (نهاية المدة)', e.contract.end, daysBetween(t, e.contract.end)]).sort((a, b) => a[2].localeCompare(b[2]));
  return res(rows.length ? 'answered' : 'no_data', { text: rows.length ? `عدد الوثائق والعقود التي تنتهي خلال الأيام الـ${n} القادمة (حتى ${until}): ${rows.length}.` : `لا توجد وثائق أو عقود تنتهي خلال الأيام الـ${n} القادمة ضمن صلاحياتك.`,
    table: rows.length ? { columns: ['الموظف', 'الوثيقة', 'تاريخ الانتهاء', 'الأيام المتبقية'], rows } : null });
}
function penalties(e){
  const rows = scoped(DB.penalties).filter(p => !e || p.emp === e.id).map(p => [empName(p.emp), p.act, p.sec, p.at, p.status]);
  const who = e ? `لـ${e.name}` : 'ضمن صلاحياتك';
  return res(rows.length ? 'answered' : 'no_data', { text: rows.length ? `الجزاءات ${who}: ${rows.length} (صدر فيها قرار ${rows.length}).` : `لا توجد جزاءات مسجلة يمكنك الاطلاع عليها ${who}.`,
    table: rows.length ? { columns: ['الموظف', 'الجزاء', 'قسم المخالفة', 'التاريخ', 'الحالة'], rows } : null });
}
function payrollSummary(range){
  let runs = DB.payrollRuns;
  if (range) { const [y, m] = [range.from.slice(0, 4), String(Number(range.from.slice(5, 7)))]; runs = runs.filter(r => r.month === `${m}/${y}`); }
  if (!runs.length) return res('no_data', { text: `لا توجد مسيرات رواتب تبدأ بين ${range.from} و${range.to}.` });
  const run = runs[0];
  const rows = visible().filter(e => totalPay(e) > 0).map(e => { const basic = totalPay(e), sp = e.contract.spEmp >= 7.5 ? 7.5 : 7, spAmt = Math.round(basic * sp / 100 * 2) / 2; return { basic, spAmt, final: run.finals[e.id] != null ? Number(run.finals[e.id]) : basic - spAmt }; });
  const sum = k => rows.reduce((s, r) => s + r[k], 0); const o = x => `${x.toFixed(3)} ر.ع`;
  const br = isBranchMode();
  return res('answered', { text: `${br ? 'رواتب فرعك' : 'مسير'} ${run.month} (بتاريخ ${run.date}): عدد الموظفين ${rows.length}، وصافي البنود ${o(sum('final'))}. لا تُعرض أي بيانات بنكية.`,
    table: { columns: ['البند', 'المجموع'], rows: [['الأجر الأساسي', o(sum('basic'))], ['الحماية الاجتماعية', o(sum('spAmt'))], ['صافي الرواتب', o(sum('final'))]] } }, { containsPay: true });
}
function legalQuestion(q, lt, rel){
  const hits = searchRules(q, { leaveCode: lt, relation: lt === 'bereavement' || !lt ? rel : null });
  if (!hits.length || hits[0].score < MIN_LEGAL_SCORE) return res('unknown', { text: `لم أجد قاعدة مطابقة في قواعد قانون العمل المعتمدة لدينا. ${LEGAL_NOTE}.`, suggestions: ['كم يوم إجازة الوفاة للأخ؟', 'متى تُستحق الإجازة السنوية؟'] });
  const top = hits[0].rule; const lines = [];
  if (rel && ['LV-015', 'LV-016', 'LV-017'].includes(top.id)) { const d = bereavementDays(rel); lines.push(`إجازة وفاة ${RELATION_AR[rel]}: ${d === 2 ? 'يومان' : `${d} أيام`} بأجر شامل.`); }
  const related = hits.slice(1, 3).filter(h => h.score >= hits[0].score * 0.5).map(h => ruleCard(h.rule));
  return res('answered', { text: lines.join('\n'), rule: ruleCard(top), related_rules: related });
}
function draftLeave(q, lt, rel, range, len){
  const m = matchEmployee(q, visible()); const self = me();
  if (m.kind === 'one' && m.employee.id !== self.id) return res('forbidden', { text: `طلب الإجازة يقدّمه الموظف بنفسه من حسابه. يمكنك تجهيز إشعار لـ${m.employee.name} بدلًا من ذلك.` });
  const code = lt || 'annual';
  if (!range) return res('clarify', { text: `حدّد تاريخ البداية (مثال: «${LEAVE_NAMES_AR[code]} من 2026-12-01 إلى 2026-12-03» أو «من بكرة 3 أيام»).` });
  const start = range.from; const end = range.from === range.to && len && len > 1 ? addDays(start, len - 1) : range.to; const days = daysBetween(start, end) + 1;
  const flags = [];
  if (start < todayIso()) flags.push({ rule: 'SAIF', text: 'تاريخ البداية في الماضي؛ تأكد من التاريخ.' });
  if (code === 'annual') { const months = ruleById('LV-002').params.eligibility_months; if (daysBetween(self.join, start) < months * 30) flags.push({ rule: 'LV-002', text: `لا تُستحق الإجازة السنوية قبل مضي ${months} أشهر من الالتحاق (م78).` }); }
  if (code === 'bereavement') { if (!rel) flags.push({ rule: 'LV-015', text: 'حدّد صلة القرابة (أخ، أب، عم…) قبل الإرسال.' }); else { const max = bereavementDays(rel); if (days > max) flags.push({ rule: max === 2 ? 'LV-016' : max === 3 ? 'LV-015' : 'LV-017', text: `المستحق لوفاة ${RELATION_AR[rel]} ${max} أيام (م84).` }); } }
  const draft = { id: uid('dr'), kind: 'leave', status: 'pending', emp: self.id, employee: self.name, type: LEAVE_TO_TYPE[code] || 'lt11', type_name: LEAVE_NAMES_AR[code], from: start, to: end, days, reason: rel && code === 'bereavement' ? `وفاة ${RELATION_AR[rel]}` : '', flags };
  return res('draft', { text: `جهّزت مسودة: ${LEAVE_NAMES_AR[code]} من ${start} إلى ${end} (عدد الأيام: ${days}).${lt ? '' : ' (النوع الافتراضي: الإجازة السنوية)'} اضغط «تأكيد» للإرسال.`, draft });
}
function draftAnnouncement(raw){
  const topicM = raw.match(/(?:عن|بخصوص|حول|بشأن|about|regarding|on)\s+(.{3,120})$/i);
  const topic = ((topicM && topicM[1]) || '').replace(/[؟?.!]+$/, '').trim();
  const ids = visible().filter(e => e.id !== me().id).map(e => e.id);
  const title = topic ? topic.slice(0, 80) : 'إشعار للموظفين';
  const body = topic ? `السلام عليكم،\nنود إحاطتكم علمًا بخصوص: ${topic}.\nللاستفسار يرجى التواصل مع الموارد البشرية.` : 'السلام عليكم،\n[اكتب نص الإشعار هنا]\nللاستفسار يرجى التواصل مع الموارد البشرية.';
  const draft = { id: uid('dr'), kind: 'announcement', status: 'pending', title, body, category: 'تعميم عام', target: isBranchMode() ? 'موظفي فرعك' : 'موظفي الشركة', ids, count: ids.length, flags: topic ? [] : [{ rule: 'SAIF', text: 'لم يُذكر موضوع الإشعار؛ عدّل النص قبل الإرسال.' }], userText: !!topic };
  return res('draft', { text: `جهّزت مسودة إشعار إلى ${draft.target} (عدد المستلمين ضمن صلاحياتك: ${ids.length}). راجع النص ثم اضغط «تأكيد».`, draft });
}

/* ---------- brain.ts (Brain A) ---------- */
function answer(question){
  const today = todayIso(); const q = parseQuery(question); const cls = classify(question, today);
  const range = () => dateRange(q, today); const lt = leaveType(q), rel = relation(q);
  const out = (r) => Object.assign(r, { intent: cls.intent, confidence: cls.confidence, scope: scopeName() });
  switch (cls.intent) {
    case 'sensitive_refused': return out(sensitiveAnswer());
    case 'unknown': return out(unknownAnswer());
    case 'legal_question': return out(legalQuestion(q, lt, rel));
    case 'draft_leave': return out(draftLeave(q, lt, rel, range(), leaveLength(q)));
    case 'draft_announcement': return out(draftAnnouncement(question));
    case 'payroll_summary': return out(payrollSummary(range()));
    case 'pending_requests': return out(pendingRequests());
    case 'expiring_documents': return out(expiringDocuments(dayWindow(q)));
    case 'leave_balance': { const t = resolveTarget(q); if (t.kind === 'stop') return out(t.result); if (t.kind === 'none') return out(res('clarify', { text: 'رصيد من؟ اكتب اسم الموظف أو رقمه الوظيفي، أو «رصيدي».' })); return out(leaveBalance(t.emp, lt)); }
    case 'penalties': { const t = resolveTarget(q); if (t.kind === 'stop') return out(t.result); return out(penalties(t.kind === 'one' ? t.emp : null)); }
    case 'overtime_summary': { const t = resolveTarget(q); if (t.kind === 'stop') return out(t.result); return out(overtimeSummary(t.kind === 'one' ? t.emp : null, range())); }
    default: {
      const t = resolveTarget(q); if (t.kind === 'stop') return out(t.result);
      if (t.kind === 'one' && (!t.self || /حضوري|my attendance|دوامي/.test(q.norm))) { const r = attendanceEmployee(t.emp, range()); r.intent0 = 'attendance_employee'; return Object.assign(out(r), { intent: 'attendance_employee' }); }
      return out(attendanceGroup(range(), cls.focus));
    }
  }
}
return { answer, classify: q => classify(q, todayIso()), searchRules: q => searchRules(parseQuery(q)), normalize, LEGAL_NOTE, RULES };
})();
window.SAIF = SAIF;

/* =====================================================================
   سيف AI chat panel — opened from the robot button in the top bar on every
   page (conversations list, input, send, saved conversations with delete). Answers come from the local Brain A
   (saif.js) on the in-page data, scoped to the signed-in account.
   Drafts never act: only the viewer's «تأكيد» click changes the data.
   ===================================================================== */
const viewerKey = () => isBranchMode() ? 'branch:' + DB.viewer.branch : 'owner';
function chatsFor(){
  DB.chatsByViewer = DB.chatsByViewer || {};
  const k = viewerKey();
  if (!DB.chatsByViewer[k]) { DB.chatsByViewer[k] = k === 'owner' ? (DB.chats || []) : []; if (k === 'owner') delete DB.chats; }
  return DB.chatsByViewer[k];
}

function ansHTML(chat, m){
  const a = m.ans || {}; const out = [];
  if (a.text) out.push(...String(a.text).split('\n').filter(Boolean).map(l => `<div>${esc(l)}</div>`));
  if (a.rule) out.push(ruleCardHTML(a.rule, true));
  (a.related_rules || []).forEach(r => out.push(`<div class="small muted mt">قاعدة ذات صلة: <b>${esc(r.id)}</b> — المادة ${esc(r.article)} · <span data-noi18n>${esc(r.title_ar)}</span></div>`));
  if (a.table && a.table.rows && a.table.rows.length) out.push(`<div class="tbl-wrap" style="margin:6px 0"><table class="t"><thead><tr>${a.table.columns.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${a.table.rows.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`);
  if (a.suggestions) out.push(`<div class="row wrap mt" style="gap:6px">${a.suggestions.map(s => `<button class="pill-opt" data-suggest="${esc(s)}" onclick="${A(() => { $('#ai-in').value = s; aiSend(); })}">${esc(s)}</button>`).join('')}</div>`);
  (m.drafts || []).forEach(d => out.push(draftCard(chat, d)));
  return out.join('');
}
function ruleCardHTML(r){
  return `<div class="card p" data-rule="${esc(r.id)}" style="margin-top:8px;box-shadow:none;border:1px solid #e9d8c9;background:#fcfaf6">
    <div class="row"><b>${ic('gavel', 's16')} ${esc(r.id)}</b><span class="small muted">— المادة ${esc(r.article)}</span></div>
    <div class="small muted" data-noi18n>${esc(r.source_ar)}</div>
    <div style="font-weight:700;margin-top:6px" data-noi18n dir="rtl" lang="ar">${esc(r.title_ar)}</div>
    <div style="margin-top:4px;line-height:1.9" data-noi18n dir="rtl" lang="ar">«${esc(r.text_ar)}»</div>
    ${r.requires_verification || r.needs_lawyer ? `<div class="banner yellow mt" style="margin-bottom:0">${ic('info', 's16')} تنبيه: هذه القاعدة معلَّمة «تحتاج تحققًا من محامٍ» قبل الاعتماد عليها.</div>` : ''}
    ${r.gray_area_ar ? `<div class="small mt"><b>منطقة رمادية:</b> <span data-noi18n dir="rtl">${esc(r.gray_area_ar)}</span></div>` : ''}
    <div class="small muted mt" data-legal-note>${ic('info', 's14')} النص العربي هو المرجع، وهذا الرد للإرشاد وليس استشارة قانونية.</div></div>`;
}
function draftCard(chat, d){
  const head = d.kind === 'leave' ? 'مسودة طلب إجازة' : 'مسودة إشعار';
  const kv = (k, v, raw) => `<span class="k">${k}</span><span style="white-space:pre-wrap" ${raw ? 'data-noi18n' : ''}>${esc(v)}</span>`;
  const rows = d.kind === 'leave'
    ? kv('الموظف', d.employee) + kv('نوع الإجازة', d.type_name) + kv('الفترة', `${d.from} → ${d.to}`) + kv('المدة', nDays(d.days)) + (d.reason ? kv('السبب', d.reason) : '')
    : kv('العنوان', d.title, d.userText) + kv('الفئة', d.category) + kv('المستلمون', `${d.target === 'موظفي فرعك' ? 'موظفو فرعك' : 'موظفو الشركة'} (العدد: ${d.count})`) + kv('النص', d.body, true);
  const st = d.status === 'confirmed' ? chip('مؤكد') : d.status === 'cancelled' ? chip('ملغى') : '';
  return `<div class="card p" data-draft="${d.id}" data-kind="${d.kind}" style="margin-top:8px;border:1px solid var(--blue-b);background:#fcfaf6;box-shadow:none">
    <div class="row"><b>${ic(d.kind === 'leave' ? 'event_note' : 'campaign', 's16')} ${head}</b><span style="margin-inline-start:auto">${st}</span></div>
    <div class="kv mt">${rows}</div>
    ${(d.flags || []).map(f => `<div class="banner yellow mt" style="margin-bottom:0">${ic('info', 's16')} <b>${esc(f.rule)}</b>&nbsp;<span>${esc(f.text)}</span></div>`).join('')}
    ${d.status === 'pending' ? `<div class="small muted mt">مسودة فقط — لن يُتخذ أي إجراء حتى تضغط «تأكيد».</div><div class="row mt"><button class="btn g sm" data-confirm onclick="${A(() => draftDecide(chat, d, true))}">${ic('check', 's14')} تأكيد</button><button class="btn l sm" data-cancel onclick="${A(() => draftDecide(chat, d, false))}">${ic('close', 's14')} إلغاء</button></div>` : ''}</div>`;
}
function draftDecide(chat, d, yes){
  if (d.status !== 'pending') return;
  if (!yes) { d.status = 'cancelled'; save(); render(); return; }
  if (d.kind === 'leave') {
    if (!inScope(d.emp) || !emp(d.emp)) { toast('الموظف خارج صلاحياتك'); return; }
    DB.leaves.push({ id: uid('lv'), emp: d.emp, type: d.type, from: d.from, to: d.to, days: d.days, status: 'قيد الانتظار', reason: d.reason || '—', at: todayIso() });
    toast('تم إنشاء طلب الإجازة');
  } else {
    const ids = (d.ids || []).filter(inScope);
    DB.notifications.unshift({ id: uid('n'), title: d.title, body: d.body, cat: d.category, to: d.target, count: ids.length, at: new Date().toISOString(), scope: isBranchMode() ? DB.viewer.branch : 'all' });
    toast('تم إرسال الإشعار');
  }
  d.status = 'confirmed'; save(); render();
}

/* سيف chat panel — opened from the top-bar robot button on any page (no sidebar entry, no page). */
let saifOpen = false;
function toggleSaif(on){ saifOpen = on === undefined ? !saifOpen : !!on; renderSaif(); renderAppbar(); if (saifOpen) setTimeout(() => { const i = $('#ai-in'); i && i.focus(); }, 30); }
function renderSaif(){
  const el = $('#saif-panel'); if (!el) return;
  el.hidden = !saifOpen; document.body.classList.toggle('saif-on', saifOpen);
  if (!saifOpen) { el.innerHTML = ''; return; }
  const chats = chatsFor();
  const cur = chats.find(c => c.id === UI['ai.cur']);
  const hist = ui('ai.hist', true);
  const bubble = (m, inner) => `<div style="display:flex;justify-content:${m.me ? 'flex-start' : 'flex-end'};margin-bottom:8px"><div class="ai-b" ${m.me ? 'data-noi18n' : 'data-answer'} style="max-width:88%;padding:8px 12px;border-radius:12px;font-size:12.5px;line-height:1.8;${m.me ? 'background:var(--navy);color:#fff;white-space:pre-wrap' : 'background:#f6f4f3'}">${inner}</div></div>`;
  const msgs = cur && cur.msgs.length ? cur.msgs.map(m => bubble(m, m.me ? esc(m.t) : ansHTML(cur, m))).join('') : '';
  el.innerHTML = `<div class="sp-h"><div class="sp-ic">${ROBOT_SVG}</div><div class="grow"><b data-saif-title>سيف AI</b><div class="small muted">مساعد الحضور الذكي</div></div>
      <button class="ibtn" title="محادثة جديدة" data-new-chat onclick="${A(() => { UI['ai.cur'] = null; renderSaif(); })}">${ic('add')}</button>
      <button class="ibtn" title="إغلاق" data-saif-close onclick="${A(() => toggleSaif(false))}">${ic('close')}</button></div>
    <div class="sp-hist"><button class="sp-hist-t" onclick="${A(() => { UI['ai.hist'] = !hist; renderSaif(); })}">${ic(hist ? 'expand_less' : 'expand_more', 's16')} المحادثات <span class="muted">(${chats.length})</span></button>
      ${hist ? `<div class="sp-hist-l">${chats.map(c => `<div class="sp-chat ${UI['ai.cur'] === c.id ? 'on' : ''}" data-chat="${c.id}" onclick="${A(() => { UI['ai.cur'] = c.id; renderSaif(); })}"><span class="mi s14 muted">chat_bubble_outline</span><span class="grow" style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" ${c.seed ? '' : 'data-noi18n'}>${esc(c.title)}</span><span class="small muted">${esc(LANG === 'ar' || LANG === 'ur' ? c.at : String(c.at).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)))}</span><button class="ibtn red" title="حذف" onclick="${A(ev => { ev.stopPropagation(); chats.splice(chats.indexOf(c), 1); if (UI['ai.cur'] === c.id) UI['ai.cur'] = null; save(); renderSaif(); })}">${ic('delete_outline')}</button></div>`).join('') || `<div class="small muted" style="padding:4px 6px">لا توجد محادثات</div>`}</div>` : ''}</div>
    <div id="ai-msgs" class="sp-msgs">${msgs || `<div class="empty" style="height:100%">${ic('chat_bubble_outline')}<div class="e-s">ابدأ محادثة جديدة مع سيف AI</div></div>`}</div>
    <div class="sp-in"><input id="ai-in" class="inp" placeholder="اكتب سؤالك هنا..." onkeydown="if(event.key==='Enter')document.getElementById('ai-send').click()"><button id="ai-send" class="tb-btn" style="background:var(--navy)" title="إرسال" onclick="${A(aiSend)}">${ic('send', 's16')}</button></div>`;
  fixIcons(el); trNode(el);
  const b = $('#ai-msgs'); b && (b.scrollTop = b.scrollHeight);
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && saifOpen && !DLG.length) toggleSaif(false); });

function aiSend(){
  const box = $('#ai-in'); const t = box ? box.value.trim() : ''; if (!t) return;
  const chats = chatsFor();
  let c = chats.find(x => x.id === UI['ai.cur']);
  if (!c) { c = { id: uid('ch'), title: t.slice(0, 60), at: arDigits(fmtIso(today()).replace(/-/g, '/')), msgs: [] }; chats.unshift(c); UI['ai.cur'] = c.id; }
  c.msgs.push({ me: true, t });
  let r; try { r = SAIF.answer(t); } catch (e) { console.error(e); r = { answer: { text: 'تعذّر إكمال الإجابة. يمكنك إعادة المحاولة.' } }; }
  const a = r.answer || {}; const drafts = a.draft ? [a.draft] : [];
  if (a.draft && a.draft.kind === 'announcement') { a.draft.body = [trKey('السلام عليكم،'), a.draft.userText ? trKey('نود إحاطتكم علمًا بخصوص: {q}.').replace('{q}', a.draft.title) : trKey('[اكتب نص الإشعار هنا]'), trKey('للاستفسار يرجى التواصل مع الموارد البشرية.')].join('\n'); }
  c.msgs.push({ me: false, intent: r.intent, ans: { text: a.text, table: a.table, rule: a.rule, related_rules: a.related_rules, suggestions: a.suggestions }, drafts });
  save(); renderSaif();
}

applyLang();
startI18n();
render();
setInterval(()=>{ const c=document.querySelector('.tb-clock'); if(c && currentRoute().page==='dashboard'){ const n=new Date(); c.innerHTML=`${pad(n.getHours()%12||12)}:${pad(n.getMinutes())} ${n.getHours()>=12?'م':'ص'}<small>${fmtEn(n)}</small>`; } }, 30000);
</script>
